            tests: "workspace_manager:: --skip _child_kills_ --skip kill_at_every_cell --skip kill_after_report_before_each_cleanup_step --skip _stopped_at_any_phase_ --skip engine::topology::coordinator::tests::interleaving:: --skip engine::topology::coordinator::tests::pipelines:: --skip engine::topology::coordinator::tests::registry_waits:: --skip engine::topology::coordinator::tests::runners:: --skip engine::topology::coordinator::tests::scheduling:: --skip engine::topology::coordinator::tests::shutdown:: --skip engine::topology::coordinator::tests::snapshot_registration:: --skip engine::topology::coordinator::tests::verification_charges:: --skip engine::topology::coordinator:: --skip engine::topology::recover:: --skip engine::tests::capacity_budget:: --skip engine::tests::kept_output:: --skip engine::tests::legacy_resume:: --skip engine::tests::questions:: --skip engine::tests::snapshot_registration:: --skip engine::tests::topology_admission:: --skip engine::tests::topology_execution:: --skip engine::tests::verification:: --skip engine::tests:: --skip engine::topology::attempt:: --skip engine::topology::run:: --skip engine::topology::integrate:: --skip engine::topology::dispatch:: --skip engine::topology::coverage:: --skip engine::topology::ledger:: --skip engine::topology::candidate:: --skip engine::topology::finalize:: --skip engine::topology::create:: --skip engine::topology::startup:: --skip engine::topology::repair:: --skip engine::topology::permits:: --skip engine::topology::emit:: --skip engine::topology::settle:: --skip engine::topology::entry:: --skip engine::topology::identity:: --skip engine::topology::preflight:: --skip engine::topology::prelock:: --skip engine::topology::profiled:: --skip engine::topology::seams:: --skip engine::topology::select:: --skip engine::report:: --skip workspace_manager::tests::containment:: --skip workspace_manager::tests::incarnations:: --skip workspace_manager::tests::residue::"
            floor: 94
        # END TEST_CATEGORIES windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install the image's toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: clippy

      - name: Configure git identity
        run: |
          git config --global user.email "ci@upstroke.local"
          git config --global user.name "upstroke CI"

      # The suite, and a witness that it ran. A green `cargo test` is not that
      # claim. A `target.<triple>.runner` bound in a `.cargo/config.toml`, in
      # `$CARGO_HOME`, in a directory above the checkout or in the process
      # environment makes Cargo compile every harness and hand each one to a
      # wrapper that exits zero; a `[workspace]` in the root manifest whose
      # `default-members` name another crate makes it build no harness of this
      # one at all. Each is a green job over a suite that never ran, each is
      # written somewhere a check reading this repository cannot see, and the
      # list is not closed -- Cargo has more ways to be told this than anyone
      # will enumerate. Counting what libtest itself reported refuses the
      # effect instead of the causes: a suite that did not execute has no
      # `test result: ok.` line to count. On each leg the line that starts
      # the harnesses hands libtest the leg's `matrix.tests`, the count of
      # passing tests is held to the leg's `matrix.floor`, and a last line
      # prints the count. The count stays now that the suite runs on
      # GitHub's machines. A Cargo target runner no longer reaches a leg,
      # since Cargo only builds and the step starts each harness itself, but
      # a `[workspace]` selection reaches GitHub's machines as it reached the
      # guest, and a leg's floor also refuses a shard whose filter matched
      # almost nothing. Each leg's floor is its share of 1700, the floor the
      # whole suite was held to as one job on the guest. Removing that many
      # tests is a deliberate act, and it edits the floors in the same
      # change.
      #
      # First, though, the compiler. Step 1 installs `1.97.1`, and a green
      # install is not yet that compiler running the suite: the toolchain
      # action tolerates a failed `rustup default` and then verifies only
      # `rustc +1.97.1`, so the install can report success while bare `cargo`
      # is still the runner's preinstalled stable. The script's three
      # questions refuse that. And the `rustc` on PATH is not the question:
      # Cargo picks its compiler through `RUSTC`, `CARGO_BUILD_RUSTC` or a
      # `build.rustc` in any config it reads, none of which this workflow can
      # see. So the script asks Cargo itself --
      # `cargo rustc --lib -- --version` runs the compiler Cargo would run,
      # and prints its version. The `rustc` on PATH is a second question, not
      # a substitute: the suite's own fixtures spawn bare `rustc` against
      # what Cargo built (`effects::tests`, the log and run-directory tests),
      # and a PATH rustc of another version fails them with an
      # incompatible-rlib error rather than a wrong answer. So the script
      # asks all three -- Cargo's compiler, PATH's rustc, PATH's cargo -- and
      # refuses to run the suite unless every one is `1.97.1`: the workflow
      # oracle holds the number in this script and the install to the one it
      # pins, and moving the compiler edits all three together.
      #
      # Then the suite, built and then run, and every process the script
      # starts waited on. Cargo builds once, with `--no-run`, and runs
      # nothing; the script takes the test harnesses from the build's own
      # messages and starts each in turn over the leg's `matrix.tests`, with
      # `-Z unstable-options --report-time` after it, so that libtest writes
      # each test's time after its result. On a stable compiler libtest takes
      # those flags only where `RUSTC_BOOTSTRAP` is set, and the variable is
      # kept away from Cargo: the build scripts of three crates this one
      # builds, `anyhow`, `thiserror` and `proc-macro2`, each probe for a
      # nightly feature, turn it on where the probe compiles with the
      # variable set, and have Cargo run them again when it changes. A Cargo
      # that saw it would build the three, and every harness over them,
      # otherwise than the legs of `test-linux` and `test-macos` and a user's
      # machine do, from a
      # tree nobody changed. So the variable is set after the build, no
      # `cargo` runs after it, and it ends with the step: the later steps run
      # in processes of their own. Without `--no-run` Cargo would run every
      # harness over the whole suite itself, untimed, before the loop ran the
      # shard. Nothing is piped into `Tee-Object`: `Start-Process` sends each
      # process's two streams to files in `RUNNER_TEMP`, `WaitForExit()`
      # returns when that process ends, and the script prints the files and
      # counts from them after the loop. The build's errors are read in a
      # `try`, so a failed read cannot replace Cargo's code. A harness the
      # step starts has the step's environment, without Cargo's run-time
      # `CARGO_*` variables, its `[env]` table or its `PATH` additions, so a
      # test reads those through `env!`, at compile time. Twice a hosted
      # shard reported its tests and did not end. In run 43719719561, on
      # 2026-11-15, the 1,669 s shard printed
      # every `test result: ok` line 31.6 minutes into its job and ran to the
      # job's limit, where the runner's clean-up killed a test process left
      # over. In run 44277078005, on 2026-11-18, `test (windows-latest, 3 of
      # 5)`, job 134707868382, printed `test result: ok. 700 passed; 0
      # failed` at 09:50:41 and ran until its 40-minute limit cancelled it,
      # and the job's clean-up killed an orphaned test binary,
      # `upstroke-8ddcc7d640fdf222`. That much was observed: the passing
      # result line, the hang, and the test binary killed at clean-up. The
      # cause is inferred from it, and from Rust's `Command`, which on
      # Windows hands a child the handles its parent holds as inheritable: a
      # test process that outlived the suite held the pipe `Tee-Object`
      # reads, so the pipeline never reached its end. Which test leaves the
      # process is not established. Waiting on a process does not depend on
      # what that process left running, and nothing the step reads is a pipe
      # a survivor can hold open.
      #
      # What is left running is then the step's to report. After the last
      # harness ends the script lists every process named `upstroke*` that
      # is still running, with its command line, and asks Windows to stop
      # it. It does not check that the process stopped. The listing names a
      # process, not the test that started it. A harness's own failure comes
      # first, with its exit code, which the loop keeps as soon as the
      # harness ends and before it copies the harness's two outputs. Each
      # copy has a `try` of its own: a copy that fails prints why, and ends
      # the step only where the harness passed, since then there is nothing
      # to count; where the harness failed the loop stops on its code. A
      # failure while copying or reading the output or listing the processes
      # cannot replace that code: the script prints the failure and still
      # exits with the harness's code. Where the harnesses exited zero the
      # same failure fails the step, because nothing was read or listed to
      # count from. Where they exited zero and a process was left, the step
      # throws: the suite passed, and a test leaves a process running. If
      # the inference is wrong and a harness itself does not end, the
      # listing is never reached, and the job's limit still ends the leg.
      - name: Uncategorised (must list zero tests)
        run: python .github/scripts/test-categories.py check

      - name: Test, and witness that the suite ran
        env:
          UPSTROKE_TEST_TEMP_FOLDS_CASE: "1"
        run: |
          $rustc = ((cargo rustc -q --lib -- --version) | Out-String).Trim(); $path_rustc = ((rustc --version) | Out-String).Trim(); $cargo = ((cargo --version) | Out-String).Trim()
          if ($rustc -notmatch '^rustc 1\.97\.1 ' -or $path_rustc -notmatch '^rustc 1\.97\.1 ' -or $cargo -notmatch '^cargo 1\.97\.1 ') { throw "the suite would run on '$rustc' (Cargo's compiler), '$path_rustc' (PATH's rustc) and '$cargo', not the image's 1.97.1: a compiler was chosen by something other than this workflow" }
          $out = Join-Path $env:RUNNER_TEMP 'suite-stdout.log'; $err = Join-Path $env:RUNNER_TEMP 'suite-stderr.log'; $built = Join-Path $env:RUNNER_TEMP 'suite-build.json'
          $build = Start-Process -FilePath cargo -ArgumentList 'test --all-targets --all-features --no-run --message-format=json-render-diagnostics' -NoNewWindow -PassThru -RedirectStandardOutput $built -RedirectStandardError $err; $null = $build.Handle; $build.WaitForExit(); $code = $build.ExitCode
          if ($code -ne 0) { try { Get-Content $err } catch { "reading the build's errors failed: $_" }; exit $code }
          $harnesses = @(Get-Content $built | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -ceq 'compiler-artifact' -and $_.profile.test -and $_.executable } | ForEach-Object { $_.executable }); if ($harnesses.Count -eq 0) { throw "Cargo built no test harness, so this shard would run nothing" }
          $env:RUSTC_BOOTSTRAP = '1'; foreach ($h in $harnesses) { $suite = Start-Process -FilePath $h -ArgumentList '${{ matrix.tests }} -Z unstable-options --report-time' -NoNewWindow -PassThru -RedirectStandardOutput "$out.part" -RedirectStandardError "$err.part"; $null = $suite.Handle; $suite.WaitForExit(); $code = $suite.ExitCode; try { Get-Content "$out.part" | Add-Content $out } catch { "copying the output of $h failed: $_"; if ($code -eq 0) { throw } }; try { Get-Content "$err.part" | Add-Content $err } catch { "copying the errors of $h failed: $_"; if ($code -eq 0) { throw } }; if ($code -ne 0) { break } }
          try { Get-Content $err; $log = Get-Content $out; $log; $left = @(Get-CimInstance Win32_Process -Filter "Name LIKE 'upstroke%'"); foreach ($p in $left) { "left running after the suite: pid $($p.ProcessId): $($p.CommandLine)"; Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue } }
          catch { if ($code -ne 0) { "reading the suite's output or listing the processes it left failed: $_" } else { throw } }
          if ($code -ne 0) { exit $code }
          if ($left.Count -gt 0) { throw "$($left.Count) test process(es) outlived the suite, listed above: a test leaves a process running, which would hold this step open" }
          $passed = [int](($log | Select-String -Pattern '^test result: ok\. (\d+) passed' | ForEach-Object { [int]$_.Matches[0].Groups[1].Value } | Measure-Object -Sum).Sum)
          if ($passed -lt ${{ matrix.floor }}) { throw "shard ${{ matrix.shard }} reported $passed passing tests, below its floor of ${{ matrix.floor }}: Cargo compiled the harnesses and executed almost none of this shard's tests" }
          "shard ${{ matrix.shard }} reported $passed passing tests; its floor is ${{ matrix.floor }}"

      # The native HOST acceptance record on each leg: the selection
      # `test-linux` and `test-macos` make, under PowerShell, on the compiler the step above has just
      # asserted, and the harness that step built. This step pipes Cargo
      # into `Tee-Object` and reads Cargo's exit from `$LASTEXITCODE`; the
      # suite step, which no longer pipes, reads its exit code from the
      # process it waited on. The step refuses unless exactly the record's
      # test ran and passed, and refuses a missing or incomplete frame:
      # BEGIN first, END last with the same summary, and chunk k at
      # position k with the tag and its exact length. The workflow oracle
      # pins the script and its case-fold map whole, immediately after the
      # suite-and-witness step.
      - name: Capture the native host acceptance record
        env:
          UPSTROKE_TEST_TEMP_FOLDS_CASE: "1"
        run: |
          cargo test --all-features --lib engine::tests::host_acceptance_record -- --ignored --exact --nocapture | Tee-Object -Variable capture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($capture -ccontains 'test engine::tests::host_acceptance_record ... ok') -or -not ($capture -cmatch '^test result: ok\. 1 passed; 0 failed; 0 ignored; ')) { throw "the capture did not run exactly the one host acceptance test to a pass" }
          $f = @($capture | Where-Object { $_ -cmatch '^UPSTROKE-HOST-ACCEPTANCE-RECORD ' } | ForEach-Object { ,($_ -split ' ') })
          $ok = $f.Count -ge 3 -and $f[0].Count -eq 7 -and $f[-1].Count -eq 7 -and $f[0][1] -ceq 'v1' -and $f[0][2] -ceq 'BEGIN' -and $f[-1][1] -ceq 'v1' -and $f[-1][2] -ceq 'END' -and ($f[0][3..6] -join ' ') -ceq ($f[-1][3..6] -join ' ') -and $f[0][4] -ceq "$($f.Count - 2)"
          for ($k = 1; $ok -and $k -lt $f.Count - 1; $k++) { $ok = $f[$k].Count -eq 5 -and $f[$k][1] -ceq 'v1' -and $f[$k][2] -ceq $f[0][3] -and $f[$k][3] -ceq "$k" -and $f[$k][4].Length -eq $(if ($k -lt $f.Count - 2) { 192 } else { 2 * ([long]$f[0][5] - ([long]$f[0][4] - 1) * 96) }) }
          if (-not $ok) { throw "the host acceptance record is missing or its framing is incomplete" }

      # The container capability observation on each leg: the selection
      # `test-linux` and `test-macos` make, under PowerShell, on the compiler the suite step asserted
      # and the harness it built, immediately after the host acceptance
      # capture. `$LASTEXITCODE` carries Cargo's exit through `Tee-Object`.
      # The step refuses unless exactly the observation's test ran and
      # passed, and refuses a missing or incomplete frame, as the capture
      # above does for its record. Every capability class passes; the record
      # is decoded from this log, and a class is not M2 acceptance. Four
      # minutes, and no environment of its own; the workflow oracle pins the
      # script and its case-fold map whole.
      - name: Capture the container capability observation
        timeout-minutes: 4
        env:
          UPSTROKE_TEST_TEMP_FOLDS_CASE: "1"
        run: |
          cargo test --all-features --lib runner::container::tests::container_capability_record -- --ignored --exact --nocapture | Tee-Object -Variable capture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($capture -ccontains 'test runner::container::tests::container_capability_record ... ok') -or -not ($capture -cmatch '^test result: ok\. 1 passed; 0 failed; 0 ignored; ')) { throw "the observation did not run exactly the one container capability test to a pass" }
          $f = @($capture | Where-Object { $_ -cmatch '^UPSTROKE-CONTAINER-CAPABILITY-RECORD ' } | ForEach-Object { ,($_ -split ' ') })
          $ok = $f.Count -ge 3 -and $f[0].Count -eq 7 -and $f[-1].Count -eq 7 -and $f[0][1] -ceq 'v1' -and $f[0][2] -ceq 'BEGIN' -and $f[-1][1] -ceq 'v1' -and $f[-1][2] -ceq 'END' -and ($f[0][3..6] -join ' ') -ceq ($f[-1][3..6] -join ' ') -and $f[0][4] -ceq "$($f.Count - 2)"
          for ($k = 1; $ok -and $k -lt $f.Count - 1; $k++) { $ok = $f[$k].Count -eq 5 -and $f[$k][1] -ceq 'v1' -and $f[$k][2] -ceq $f[0][3] -and $f[$k][3] -ceq "$k" -and $f[$k][4].Length -eq $(if ($k -lt $f.Count - 2) { 192 } else { 2 * ([long]$f[0][5] - ([long]$f[0][4] - 1) * 96) }) }
          if (-not $ok) { throw "the container capability record is missing or its framing is incomplete" }

  # The floor `Cargo.toml` publishes, checked for each of the three targets,
  # one `include:` entry apiece: the runner that checks it and its tuple,
  # which the toolchain step installs and the check names with `--target`.
  # Each target is checked on its own platform. The macOS entry runs on
  # `macos-latest`, so Cargo builds dependency build scripts and procedural
  # macros for macOS at 1.85, as a user's Mac does. It returned to
  # `macos-latest` on 2026-11-25, once the organisation's macOS job limit,
  # raised from 5 to 50 with its move to GitHub Enterprise Cloud on
  # 2026-11-24, was seen in effect.
  msrv:
    name: msrv (Rust 1.85, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.85.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --locked --target ${{ matrix.target }} --all-targets --all-features

  # The effect denylist is rustc-resolved, so it only denies what the compiler
  # actually compiles — and `lint` below is `ubuntu-latest`, which never compiles
  # a `#[cfg(windows)]` body at all. Measured (`PR5-CONF-014`): a raw
  # `std::fs::write` in a non-allowlisted module passes Ubuntu clippy, the test
  # jobs on all three platforms and the msrv job on all three platforms when it is
  # placed under `#[cfg(windows)]`, and is refused with the `UPSTROKE-EFFECT R21/R18`
  # note by MSVC clippy. So without this job `expected_failures_refusals[5]` and
  # `[6]` are undischarged for the Windows half of the tree.
  #
  # A separate job rather than a step in a test job, deliberately: the
  # Windows suite job, `test-windows-hosted`, is the attestation of record
  # for the Windows suite and a lint failure must not be able to masquerade
  # as a test failure in it. This
  # leg stays on windows-latest on every lane, on purpose: GitHub's runner
  # remains the neutral witness that the Windows tree compiles clean, and its
  # second step, `cargo build --all-targets`, makes it the witness that the
  # tree code-generates and links on current stable too, library, binaries and
  # test harnesses alike -- `cargo check` and Clippy stop before codegen, and
  # the Windows suite's shards link with the pinned `1.97.1`, which moves
  # only by an edit to that pin. In the dev
  # profile, which is the profile every CI leg here builds; `release.yml` builds
  # the shipped artifact with `--release`. The two steps fail separately and the
  # log names which.
  lint-windows:
    name: lint (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # Pinned by the workflow oracle as `WINDOWS_BUILD_WITNESS`, exactly once
      # on exactly one windows-latest job; a substring reading is not the check.
      # `build --all-targets`, not `test --no-run`: the latter links only
      # test-profile artifacts, so a `#[cfg(all(windows, not(test)))]` body in
      # a binary would never be linked here.
      - run: cargo build --all-targets --all-features

  # PR5-MACOS-CLIPPY-NEVER-RUN. Ubuntu Clippy configures out every
  # `#[cfg(target_os = "macos")]` region and the Windows leg configures out the
  # same; macOS ran tests and MSRV but never Clippy. So a denied call — an
  # `.expect()` in the macOS `create_cloexec_pipe`, for instance — could ship
  # with every required check green. This leg is the whole repair.
  #
  # The leg runs on Linux and compiles for `aarch64-apple-darwin`, the tuple
  # `macos-latest` builds, and it stays on Linux. Clippy lints only this
  # package's own code, and `cfg` follows the target, not the host, so the
  # cross-compiled lint evaluates every `#[cfg(target_os = "macos")]` region
  # of the package's target code as a Mac would. A host unit of this package
  # -- a build script or a proc-macro -- would still be linted for Linux, so
  # the package may have none:
  # `no_repository_file_adds_a_host_unit_the_macos_cross_checks_cannot_reach`
  # refuses one, and adding one means restoring a native `macos-latest`
  # Clippy leg in the same change. The
  # toolchain step installs that tuple's standard library, and the workflow
  # oracle holds it to the tuple the command names. It moved off
  # `macos-latest` when GitHub ran at most five macOS jobs at once for the
  # account and each run asked for seven: this leg, an `msrv` leg and the five
  # macOS test legs. Run 45175187088 shows each macOS job starting as another
  # ended. The nine macOS test legs still run natively, and the `msrv` leg is
  # native again, for the reason the comment above `msrv` gives.
  lint-macos:
    name: lint (macos)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --target aarch64-apple-darwin --all-targets --all-features -- -D warnings

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: bash .github/scripts/test-release-record.sh
      - run: bash .github/scripts/test-pr-policy.sh
      - run: bash .github/scripts/test-pr-ledger-evidence.sh
      - run: bash .github/scripts/test-docs-consistency.sh
      - run: bash .github/scripts/test-internals-notes.sh
      # The audit gate's decode probe reads CPython's own bytecode, and every
      # answer the gate asserts of it was measured on CPython 3.12. When this
      # job's image moved from ubuntu-24.04 to ubuntu-26.04, whose inventories
      # list Python 3.12.3 and 3.14.4, the unchanged gate printed 45 failures.
      # The job did not print its interpreter; a private CPython 3.14.4 build
      # prints the same 45 lines, and 3.12 passes. So the gate runs that probe
      # on `python3.12`, refusing one that is not CPython 3.12, and this step
      # puts one on PATH; the rest of the gate runs on the image's `python3`.
      # Moving the version re-measures the gate's expectations in the same
      # change. The workflow oracle allows this action one input.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: bash .github/scripts/test-pr-ready-audit.sh
      - run: bash .github/scripts/test-categories.sh

  # Branch protection requires this one deliberately stable context. Keeping
  # the external rule pointed at an aggregate means adding a platform or
  # splitting a gate cannot silently leave GitHub protecting yesterday's job
  # names. `always()` makes a failed or cancelled dependency produce a failed
  # aggregate instead of a missing required check that never settles. Every
  # gate must succeed, `test-windows-hosted` among them, on every event.
  # Until 2026-11-20 the aggregate required exactly one of two Windows suite
  # jobs, the guest's or the hosted one, to succeed and the other to be
  # skipped; with the guest retired, a skipped `test-windows-hosted` is red
  # like any skipped gate. `test-windows-hosted` is a matrix, read through
  # one result as `test-linux`, `test-macos` and `msrv` are, and the rule
  # accepts `success`
  # alone from it. What GitHub gives a matrix whose leg did not finish is
  # observed: a leg GitHub cancelled without a runner made its matrix
  # `abandoned` and the aggregate red, in runs 44114671287 (`msrv`) and
  # 44149091955 (`test`, before the split). No hosted shard has been lost
  # that way yet. A
  # `success` reported over an unfinished leg is what the rule cannot
  # refuse.
  merge-gate:
    name: upstroke-ci
    if: always()
    needs: [lint, lint-windows, lint-macos, msrv, test-linux, test-macos, test-windows-hosted]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every gate
        shell: bash
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          LINT_WINDOWS_RESULT: ${{ needs.lint-windows.result }}
          LINT_MACOS_RESULT: ${{ needs.lint-macos.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
          TEST_LINUX_RESULT: ${{ needs.test-linux.result }}
          TEST_MACOS_RESULT: ${{ needs.test-macos.result }}
          TEST_WINDOWS_HOSTED_RESULT: ${{ needs.test-windows-hosted.result }}
        run: |
          failed=0
          for gate in LINT LINT_WINDOWS LINT_MACOS MSRV TEST_LINUX TEST_MACOS TEST_WINDOWS_HOSTED; do
            result_var="${gate}_RESULT"
            result="${!result_var}"
            if [[ "$result" != "success" ]]; then
              echo "$gate did not succeed: $result" >&2
              failed=1
            fi
          done
          exit "$failed"
