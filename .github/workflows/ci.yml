opology::coordinator::tests::interleaving::s --skip engine::topology::coordinator::tests::an --skip engine::topology::recover::tests::t --skip workspace_manager::tests::c --skip workspace_manager::tests::n --skip engine::tests::a_r --skip engine::topology::coordinator::tests::a_pipeline_is_served_while_an --skip engine::topology::attempt:: --skip workspace_manager::tests::a --skip engine::tests::a_c --skip engine::tests::a_d --skip engine::tests::a_f --skip engine::topology::coordinator::tests::interleaving::i --skip engine::topology::coordinator::tests::a_f --skip engine::topology::coordinator::tests::a_g --skip engine::tests::a_b --skip runner::contract::"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          # `clippy` is a TEST dependency here, not only a lint one. PR5's
          # `expected_failures_refusals[6]` is "a disallowed primitive or
          # effectful wrapper outside an allowlisted module fails clippy", and
          # `effects::tests::every_declared_effect_denial_refuses_for_the_reason_
          # it_declares` discharges it by compiling one fixture per resolution
          # shape with `clippy-driver`. `dtolnay/rust-toolchain` installs the
          # minimal profile, so without this the fixtures could not run in the
          # job that runs the tests — which is `PR5-C-DOCTEST-FIXTURES-NEVER-RAN`
          # one step removed.
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The engine shells out to git and asserts on its output; runners have
      # git but no identity, and several tests commit.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@upstroke.local"
          git config --global user.name "upstroke CI"

      # `the_temporary_object_scan_resolves_case_aliases_as_the_filesystem_does`
      # requires its native casefold branch only where the leg declares that
      # the temporary directory its suite runs under folds case; anywhere
      # else -- the ubuntu legs, a developer's TMPDIR on case-sensitive APFS --
      # it observes the branch instead of failing it. The macOS runner's
      # temporary directory folds case and the ubuntu runner's does not, so
      # each platform's job declares its own, and `test-windows-hosted` makes
      # the same declaration for the hosted runner's NTFS. The workflow oracle
      # pins this one step-level `env:` as a whole map (the job's row of
      # `TEST_JOBS`), the way
      # it pins the aggregate's: any other key here is refused. The cargo
      # line hands libtest the leg's `matrix.tests`, on a Linux leg as on a
      # macOS one: the shard's filters, where it has any, and its skips.
      - run: cargo test --all-targets --all-features -- ${{ matrix.tests }}
        env:
          UPSTROKE_TEST_TEMP_FOLDS_CASE: "1"

      # The native HOST acceptance record for this platform (Gate7 R21's host
      # row). `engine::tests::host_acceptance_record` is ignored by the suite
      # above and selected here by its exact name. It drives a fresh run and a
      # parked, answered and resumed run, both schema-4 runs on the production
      # HostRunner through the public entry points, and prints their raw
      # records as numbered hex lines between BEGIN and END
      # (`docs/internals/engine/tests.md`). `pipefail` carries Cargo's exit
      # through `tee`. The step then refuses unless exactly that test ran and
      # passed, and refuses a missing or incomplete frame. Printing is not
      # acceptance: the record is decoded from this log and every digest
      # checked. The step reuses the suite step's case-fold declaration, and
      # the workflow oracle pins its script and that map whole, immediately
      # after the suite.
      - name: Capture the native host acceptance record
        env:
          UPSTROKE_TEST_TEMP_FOLDS_CASE: "1"
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/host-acceptance-record.log"
          cargo test --all-features --lib engine::tests::host_acceptance_record -- --ignored --exact --nocapture | tee "$log"
          if ! grep -qx 'test engine::tests::host_acceptance_record \.\.\. ok' "$log" || ! grep -q '^test result: ok\. 1 passed; 0 failed; 0 ignored; ' "$log"; then echo "the capture did not run exactly the one host acceptance test to a pass" >&2; exit 1; fi
          awk '
            $1 == "UPSTROKE-HOST-ACCEPTANCE-RECORD" { f[++m] = $0 }
            END {
              nb = split(f[1], b, " "); ne = split(f[m], e, " ")
              ok = m >= 3 && nb == 7 && ne == 7 && b[2] == "v1" && b[3] == "BEGIN" && e[2] == "v1" && e[3] == "END"
              ok = ok && b[4] " " b[5] " " b[6] " " b[7] == e[4] " " e[5] " " e[6] " " e[7] && b[5] "" == (m - 2) ""
              for (k = 2; ok && k < m; k++) ok = split(f[k], c, " ") == 5 && c[2] == "v1" && c[3] "" == b[4] "" && c[4] "" == (k - 1) "" && length(c[5]) == (k < m - 1 ? 192 : 2 * (b[6] - (b[5] - 1) * 96))
              exit !ok
            }' "$log" || { echo "the host acceptance record is missing or its framing is incomplete" >&2; exit 1; }

      # The container capability observation for this platform (Gate7 M2's
      # runtime question, contract version 2 under its root audit).
      # `runner::container::tests::container_capability_record` is ignored by
      # the suite and selected here by its exact name. It asks the CLI the
      # contract's bounded read-only questions -- the endpoint the CLI
      # resolved, the daemon's version, selected version fields and three
      # local image inspections, never a pull -- through the product's
      # process path, reduces every endpoint-sensitive answer in memory, and
      # prints the reduced record as numbered hex lines between BEGIN and END
      # (`docs/internals/runner/container/tests.md`). Every capability class
      # passes, an absent Docker included; an unresolved process, a binding
      # failure or a record its own decoder refuses fails the test.
      # `pipefail` carries Cargo's exit through `tee`; the step then refuses
      # unless exactly that test ran and passed, and refuses a missing or
      # incomplete frame. A class is an observation, not M2 acceptance, and
      # the Linux row is a control. Four minutes bound the 135 s the
      # questions may request, with Cargo's start. The step adds no
      # environment of its own; the workflow oracle pins it whole,
      # immediately after the host acceptance capture.
      - name: Capture the container capability observation
        timeout-minutes: 4
        env:
          UPSTROKE_TEST_TEMP_FOLDS_CASE: "1"
        run: |
          set -eo pipefail
          log="$RUNNER_TEMP/container-capability-record.log"
          cargo test --all-features --lib runner::container::tests::container_capability_record -- --ignored --exact --nocapture | tee "$log"
          if ! grep -qx 'test runner::container::tests::container_capability_record \.\.\. ok' "$log" || ! grep -q '^test result: ok\. 1 passed; 0 failed; 0 ignored; ' "$log"; then echo "the observation did not run exactly the one container capability test to a pass" >&2; exit 1; fi
          awk '
            $1 == "UPSTROKE-CONTAINER-CAPABILITY-RECORD" { f[++m] = $0 }
            END {
              nb = split(f[1], b, " "); ne = split(f[m], e, " ")
              ok = m >= 3 && nb == 7 && ne == 7 && b[2] == "v1" && b[3] == "BEGIN" && e[2] == "v1" && e[3] == "END"
              ok = ok && b[4] " " b[5] " " b[6] " " b[7] == e[4] " " e[5] " " e[6] " " e[7] && b[5] "" == (m - 2) ""
              for (k = 2; ok && k < m; k++) ok = split(f[k], c, " ") == 5 && c[2] == "v1" && c[3] "" == b[4] "" && c[4] "" == (k - 1) "" && length(c[5]) == (k < m - 1 ? 192 : 2 * (b[6] - (b[5] - 1) * 96))
              exit !ok
            }' "$log" || { echo "the container capability record is missing or its framing is incomplete" >&2; exit 1; }

  # The Windows suite, on every lane: a pull request, a push to master and a
  # merge-queue entry alike run it here, one suite in twenty-two shards, each a leg
  # of this job's matrix on a windows-latest runner of its own. It is no
  # longer a twin for the runs a picker sent off a self-hosted guest; the
  # guest's history is below.
  #
  # The compiler. Step 1 installs `1.97.1`, not `stable`: the compiler the
  # guest's image carried when the guest was retired. The pin is kept so
  # that the suite's compiler moves by an edit here -- the install, the two
  # lines of the suite step that refuse any other compiler and the workflow
  # oracle's constant, together -- and not with GitHub's stable. `lint
  # (windows)` compiles, code-generates and links the tree on current
  # stable on every event. The install step's name and the suite step's
  # refusal still call the version "the image's". The first of the suite
  # step's compiler questions compiles the dependencies, which the suite
  # would compile next anyway. `clippy` is a test dependency here, as in
  # `test-linux` and `test-macos` above.
  #
  # The cache. The job carries no cache step, and the workflow oracle
  # refuses one. Until 2026-11-20 the reason was that `master` saved a twin
  # cache only on a push the picker sent here, so nearly every run would
  # upload a cache nothing later read. Every push to `master` now runs these
  # legs, so `master` would save one that pull requests and queue entries
  # could restore. Whether that pays inside a leg's 40 minutes is not
  # measured, and adding a cache step is a change of its own.
  #
  # The guest. From 2026-09-01 the suite ran as one job on an ephemeral
  # self-hosted guest on the build box: a throwaway overlay of a frozen
  # Server 2025 image, one job per boot. Measured 2026-09-15/16: five hosted
  # samples of the suite on windows-latest (run 34980597250, at `126b8832`)
  # took 1122-1499 s in the harness, 21m 30s to 28m 03s a job; the guest, on
  # three green runs of pull request #299, took 346 s in the harness, 6m 47s
  # to 6m 55s a job. The merge queue ran on windows-latest from 2026-09-16,
  # and returned to the guest after its October timeouts: three queue
  # entries of one head reached a 45-minute limit and two of the next head a
  # 55-minute one, each cancelled before its suite reported a complete
  # result. From 2026-11-12 a `pick-windows-home` job could send a run here
  # instead, opt-in, through the repository variables `WINGUEST_BUSY`,
  # `WINGUEST_QUEUE_LIMIT` and, later, `WINGUEST_PR_HOSTED`. With
  # `WINGUEST_BUSY` set on 2026-11-19, every run came here. On 2026-11-20
  # the guests were deleted from the build box on the owner's direction, and
  # the picker, the guest's job and the reads of the three variables were
  # removed from this workflow.
  #
  # The host acceptance capture and the container capability observation
  # follow the suite on each leg: each runs the test it names and checks its
  # frame, and every capability class passes, an absent Docker included.
  #
  # Shards, because one job no longer fits. Measured on 2026-11-15, run
  # 43719719561, on windows-latest with four processors: the whole suite
  # took 3,311 to 4,292 s in the harness, 59 to 76 minutes a job. Four
  # shards by test name took 692 to 1,669 s and ran 193 + 776 + 320 + 2,218
  # = 3,507 tests, the whole suite's count. The slowest leg that ended took
  # 22m 53s. The 1,669 s shard, the rest of `engine::topology::`, was
  # divided in two, which made five.
  #
  # Then ten, divided by measured time, because a run's slowest leg sets its
  # wall clock. In run 44614925593 on 2026-11-19 the five legs' libtest
  # harnesses took 1201, 508, 976, 564 and 860 s, and the slowest job took
  # 24.3 minutes, against about 3.6 minutes fixed per leg: setup, the
  # compiler questions, a 1m45s to 2m46s compile, and the two record
  # captures. The nine filters of 2026-11-19 came from per-test weights of
  # a sequential Linux run, scaled to those five measured walls and blended
  # with a uniform per-test model. The first three divided the 1201 s shard
  # by the opening of a test's name, `a_p`, `a_r` and the rest of `a`; the
  # other six were module paths: the rest of
  # `engine::topology::coordinator::`, `engine::topology::recover::`, the
  # rest of `engine::topology::`, the rest of `engine::`, `runner::` and
  # `workspace_manager::`, with everything else last. Their slowest leg was
  # predicted at about 13 to 16 minutes. Run 44667503206 measured the ten
  # for the first time. The jobs took 6.4, 8.1, 15.8, 12.1, 14.0, 10.0,
  # 18.6, 4.5, 13.2 and 7.4 minutes, and their libtest harnesses 189, 209,
  # 708, 498, 636, 368, 878, 76, 545 and 223 s, 4330 s in all, with about
  # 3.8 minutes of each job fixed. The slowest, at 18.6 minutes, was the
  # seventh, the rest of `engine::`.
  #
  # The ten were re-split on 2026-11-20 from that run: each test's
  # sequential Linux duration scaled so that the leg it ran in sums to that
  # leg's measured harness, blended half and half with a uniform per-test
  # model, and nine filters chosen by a search for the slowest leg. The
  # slowest leg was predicted at about 14.4 minutes.
  #
  # Fourteen from 2026-11-22, each of the first thirteen named by a list of
  # filters and the last by everything else. The fourteen were first packed
  # on 2026-11-22 from run 45045067738 alone, and run 45233912312 measured
  # them. They were re-packed from the mean of each test's measured times
  # over CI runs 45045067738, 45161322179 and 45233912312. Tests are packed
  # into legs whole module by whole module, and a module is split by the
  # opening of its tests' names only where it alone exceeds a leg's budget.
  #
  # The filters were then rebalanced from each test's median time over CI
  # runs 45259861458, 45265008874, 45269007219, 45273775506 and
  # 45337940696, moving whole filters between legs so that each leg's
  # median job time would be about ten minutes or less, the target until
  # 2026-11-25; it is now about seven minutes a leg. The rebalance was not
  # timed before it landed: the CI run of the pull request that landed it
  # was its first measurement. Twenty-two since 2026-11-25, each of the
  # first twenty-one named by a list of filters and the last by everything
  # else: that day's division of every suite, its runs, its fixed parts and
  # its predictions, is in the comment above `test-linux`.
  #
  # Single tests set a floor under every leg: a leg takes no less than its
  # longest test plus the job's fixed minutes. In run 45045067738 the longest
  # single tests were
  # `engine::topology::recover::tests::kill_after_report_before_each_cleanup_step_after_the_effect`,
  # 249.8 s, and
  # `engine::topology::recover::tests::kill_after_report_before_each_cleanup_step_before_the_effect`,
  # 244.5 s. Under the re-pack from the three runs every leg's prediction,
  # about 9 minutes a job, was above that floor.
  #
  # The shard rule: a leg runs the tests whose names contain any of its
  # filters and none of the filters of the legs before it, each of those a
  # `--skip`; the last leg has no filter and runs the tests that contain
  # none of them. So every test runs in exactly one leg. The workflow oracle
  # derives the table below from its filter lists and its floors, and holds
  # this matrix to it entry for entry; the twenty-two floors sum to 1700, the
  # floor the whole suite
  # was held to as one job on the guest. Every `shard:` and `tests:` value
  # is double-quoted: a `tests:` value contains `:: `, a colon and a space,
  # which YAML reads as a mapping in a plain scalar.
  #
  # `fail-fast: false`, so one leg's failure does not cancel the others
  # before they report. The aggregate reads the twenty-two legs through one
  # result, `needs.test-windows-hosted.result`, as it reads the
  # `test-linux`, `test-macos` and `msrv` matrices through one result each,
  # and it accepts `success` alone
  # from it, as from every gate. What GitHub gives a matrix whose leg did
  # not finish is observed, not a rule stated here: a leg GitHub cancelled
  # without a runner made its matrix `abandoned` and the aggregate red, in
  # runs 44114671287 (`msrv`) and 44149091955 (`test`, the one job the Linux
  # and macOS legs had before the split). No hosted shard has
  # been lost that way yet. A `success` reported over an unfinished leg is
  # what the rule cannot refuse.
  #
  # 40 minutes a leg: 1.75 times the slowest leg that ended in run
  # 43719719561, and inside the merge queue's 60. In that run the 1,669 s
  # shard printed every `test result: ok` line 31.6 minutes into its job
  # and did not end. It ran to the job's limit, where the runner's clean-up
  # killed a test process left over. That the process held the step's
  # output until then is inferred, not seen. The limit bounds the hang; it
  # does not repair it.
  #
  # It happened again on 2026-11-18, in run 44277078005: `test
  # (windows-latest, 3 of 5)` printed `test result: ok. 700 passed; 0
  # failed` at 09:50:41, ran until these 40 minutes cancelled it, and the
  # job's clean-up killed an orphaned test binary,
  # `upstroke-8ddcc7d640fdf222`. The suite step no longer pipes Cargo into
  # `Tee-Object`, the pipe a surviving test process is inferred to have
  # held in both runs. It waits on each process it starts and reads the
  # suite's output from files; it lists, and asks Windows to stop, any
  # `upstroke*` process still running, and fails for it where a harness's
  # own exit has not already failed the step. The comment above this job's suite step says
  # what was observed, what is inferred, and that the test which leaves
  # the process is not established.
