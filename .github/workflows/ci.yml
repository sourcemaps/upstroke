name: CI

on:
  # `master` is the only base. The parallel-execution design's integration
  # branch, `codex/parallelism-design`, was deleted once its slices had landed;
  # standing another one up means adding its name to every branch list here and
  # in pr-policy.yml, and to the gate that pins them, in one change
  # (MAINTAINING.md, Repository rules).
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, edited, synchronize, reopened]
  # The merge queue builds each entry on the head of its base plus the entries
  # queued ahead of it, and lands exactly the commit these contexts passed on;
  # a branch is never brought up to date by hand to merge (MAINTAINING.md,
  # Repository rules). The concurrency key below is `github.ref` for this
  # event, one queue branch per entry, so entries never cancel each other.
  merge_group:
    types: [checks_requested]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 45 minutes on the macOS leg and 30 on ubuntu, on every lane. In two
    # merge-queue entries of one head on 2026-10-29, runs 40834103792 and
    # 40838006947, `test (macos-latest)` exceeded the 30 minutes and was
    # cancelled. The second job log contains every closing test summary,
    # each ok; printed summaries are not a successful exit. The budget
    # names no cause for either cancellation and repairs no test.
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the first-class target (DESIGN.md §1) and its suite is not
        # an afterthought: the subprocess supervisor, the cmd /C quoting and the
        # PATHEXT resolution all behave differently per platform and are covered
        # by tests. It is absent from this matrix because it runs below, in
        # `test-windows` on a self-hosted runner, or in `test-windows-hosted`
        # when the guest is busy; these two legs stay on GitHub's runners.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          # `clippy` is a TEST dependency here, not only a lint one. PR5's
          # `expected_failures_refusals[6]` is "a disallowed primitive or
          # effectful wrapper outside an allowlisted module fails clippy", and
          # `effects::tests::every_declared_effect_denial_refuses_for_the_reason_
          # it_declares` discharges it by compiling one fixture per resolution
          # shape with `clippy-driver`. `dtolnay/rust-toolchain` installs the
          # minimal profile, so without this the fixtures could not run in the
          # job that runs the tests — which is `PR5-C-DOCTEST-FIXTURES-NEVER-RAN`
          # one step removed.
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The engine shells out to git and asserts on its output; runners have
      # git but no identity, and several tests commit.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@upstroke.local"
          git config --global user.name "upstroke CI"

      # `the_temporary_object_scan_resolves_case_aliases_as_the_filesystem_does`
      # requires its native casefold branch only where the leg declares that
      # the temporary directory its suite runs under folds case; anywhere
      # else -- the ubuntu leg, a developer's TMPDIR on case-sensitive APFS --
      # it observes the branch instead of failing it. The macOS runner's
      # temporary directory folds case and the ubuntu runner's does not, so
      # the declaration is per leg, and `test-windows` and its hosted twin
      # make the same declaration for the guest's and the hosted runner's
      # NTFS. The workflow oracle pins this one
      # step-level `env:` as a whole map (`TEST_STEP_ENV`), the way it pins
      # the aggregate's: any other key here is refused.
      - run: cargo test --all-targets --all-features
        env:
          UPSTROKE_TEST_TEMP_FOLDS_CASE: ${{ matrix.os == 'macos-latest' && '1' || '' }}

      # The native HOST acceptance record for this platform (Gate7 R21's host
      # row). `engine::tests::host_acceptance_record` is ignored by the suite
      # above and selected here by its exact name. It drives a fresh run and a
      # parked, answered and resumed run, both schema-4 runs on the production
      # HostRunner through the public entry points, and prints their raw
      # records as numbered hex lines between BEGIN and END
      # (`docs/internals/engine/tests.md`). `pipefail` carries Cargo's exit
      # through `tee`. The step then refuses unless exactly that test ran and
      # passed, and refuses a missing or incomplete frame. Printing is not
      # acceptance: the record is decoded from this log and every digest
      # checked. The step reuses the suite step's case-fold declaration, and
      # the workflow oracle pins its script and that map whole, immediately
      # after the suite.
      - name: Capture the native host acceptance record
        env:
          UPSTROKE_TEST_TEMP_FOLDS_CASE: ${{ matrix.os == 'macos-latest' && '1' || '' }}
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/host-acceptance-record.log"
          cargo test --all-features --lib engine::tests::host_acceptance_record -- --ignored --exact --nocapture | tee "$log"
          if ! grep -qx 'test engine::tests::host_acceptance_record \.\.\. ok' "$log" || ! grep -q '^test result: ok\. 1 passed; 0 failed; 0 ignored; ' "$log"; then echo "the capture did not run exactly the one host acceptance test to a pass" >&2; exit 1; fi
          awk '
            $1 == "UPSTROKE-HOST-ACCEPTANCE-RECORD" { f[++m] = $0 }
            END {
              nb = split(f[1], b, " "); ne = split(f[m], e, " ")
              ok = m >= 3 && nb == 7 && ne == 7 && b[2] == "v1" && b[3] == "BEGIN" && e[2] == "v1" && e[3] == "END"
              ok = ok && b[4] " " b[5] " " b[6] " " b[7] == e[4] " " e[5] " " e[6] " " e[7] && b[5] "" == (m - 2) ""
              for (k = 2; ok && k < m; k++) ok = split(f[k], c, " ") == 5 && c[2] == "v1" && c[3] "" == b[4] "" && c[4] "" == (k - 1) "" && length(c[5]) == (k < m - 1 ? 192 : 2 * (b[6] - (b[5] - 1) * 96))
              exit !ok
            }' "$log" || { echo "the host acceptance record is missing or its framing is incomplete" >&2; exit 1; }

      # The container capability observation for this platform (Gate7 M2's
      # runtime question, contract version 2 under its root audit).
      # `runner::container::tests::container_capability_record` is ignored by
      # the suite and selected here by its exact name. It asks the CLI the
      # contract's bounded read-only questions -- the endpoint the CLI
      # resolved, the daemon's version, selected version fields and three
      # local image inspections, never a pull -- through the product's
      # process path, reduces every endpoint-sensitive answer in memory, and
      # prints the reduced record as numbered hex lines between BEGIN and END
      # (`docs/internals/runner/container/tests.md`). Every capability class
      # passes, an absent Docker included; an unresolved process, a binding
      # failure or a record its own decoder refuses fails the test.
      # `pipefail` carries Cargo's exit through `tee`; the step then refuses
      # unless exactly that test ran and passed, and refuses a missing or
      # incomplete frame. A class is an observation, not M2 acceptance, and
      # the Linux row is a control. Four minutes bound the 135 s the
      # questions may request, with Cargo's start. The step adds no
      # environment of its own; the workflow oracle pins it whole,
      # immediately after the host acceptance capture.
      - name: Capture the container capability observation
        timeout-minutes: 4
        env:
          UPSTROKE_TEST_TEMP_FOLDS_CASE: ${{ matrix.os == 'macos-latest' && '1' || '' }}
        run: |
          set -eo pipefail
          log="$RUNNER_TEMP/container-capability-record.log"
          cargo test --all-features --lib runner::container::tests::container_capability_record -- --ignored --exact --nocapture | tee "$log"
          if ! grep -qx 'test runner::container::tests::container_capability_record \.\.\. ok' "$log" || ! grep -q '^test result: ok\. 1 passed; 0 failed; 0 ignored; ' "$log"; then echo "the observation did not run exactly the one container capability test to a pass" >&2; exit 1; fi
          awk '
            $1 == "UPSTROKE-CONTAINER-CAPABILITY-RECORD" { f[++m] = $0 }
            END {
              nb = split(f[1], b, " "); ne = split(f[m], e, " ")
              ok = m >= 3 && nb == 7 && ne == 7 && b[2] == "v1" && b[3] == "BEGIN" && e[2] == "v1" && e[3] == "END"
              ok = ok && b[4] " " b[5] " " b[6] " " b[7] == e[4] " " e[5] " " e[6] " " e[7] && b[5] "" == (m - 2) ""
              for (k = 2; ok && k < m; k++) ok = split(f[k], c, " ") == 5 && c[2] == "v1" && c[3] "" == b[4] "" && c[4] "" == (k - 1) "" && length(c[5]) == (k < m - 1 ? 192 : 2 * (b[6] - (b[5] - 1) * 96))
              exit !ok
            }' "$log" || { echo "the container capability record is missing or its framing is incomplete" >&2; exit 1; }

  # Where this run's Windows suite should go: `guest`, the self-hosted guest
  # on the build machine, or `hosted`, GitHub's windows-latest. The guest is
  # one machine, shared with the operator's baselines and Upstroke runs, and
  # on a busy day each makes the other fail (owner request, 2026-11-11). The
  # answer is the job output `home`: `test-windows` runs when it is `guest`
  # and `test-windows-hosted` when it is `hosted`.
  #
  # The answer is `hosted` when the repository variable WINGUEST_BUSY is `1`
  # (the build machine's operator sets it while the machine is held), or when
  # the repository variable WINGUEST_QUEUE_LIMIT is a positive whole number
  # and the `test (winguest)` jobs queued or in progress in other runs of
  # this workflow number that limit or more. Routing on the queue is opt-in:
  # with WINGUEST_QUEUE_LIMIT unset, empty or anything else the queue is not
  # counted, no API call is made, and the answer is `guest`, so with neither
  # variable set every run goes to the guest as it did before the twin
  # existed. A limit that applied by default would be reached by ordinary
  # concurrency -- one build and one queue entry -- and send runs, merge-queue
  # entries among them, to a hosted suite whose October 2026 queue runs were
  # cancelled at their timeouts (operator decision, 2026-11-12, on the first
  # review of this job). The answer is also `guest` whenever the API cannot
  # be read: a failed question must not move a run off the machine every
  # lane has run on so far. The count takes the queued and the in-progress
  # runs in two queries, so a run that moves between them can be listed by
  # both: run ids are collected from both and each distinct run's jobs are
  # counted once, this run left out. Every page of every listing is read,
  # and a failure on any page is the API not being readable. The script
  # prints what it found.
  #
  # Reading other runs' jobs needs `actions: read`, which the workflow's
  # token does not carry. This job alone widens it, by that one read scope;
  # it checks out nothing and runs no step but the script below. The
  # workflow oracle pins the job whole -- fields, permissions, output,
  # environment and the script as text -- and refuses a `permissions:` block
  # on any other job; `the_windows_home_picker_answers_from_canned_api_pages`
  # runs this script against canned API answers, a fake `gh` on its PATH
  # (`docs/internals/effects/tests.md`).
  pick-windows-home:
    name: pick windows home
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      home: ${{ steps.pick.outputs.home }}
    steps:
      - name: Pick where the Windows suite runs
        id: pick
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WINGUEST_BUSY: ${{ vars.WINGUEST_BUSY }}
          WINGUEST_QUEUE_LIMIT: ${{ vars.WINGUEST_QUEUE_LIMIT }}
        run: |
          winguest_jobs() {
            local runs="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs"
            local status listed seen="" id jobs matched count=0
            local -a run_ids
            for status in queued in_progress; do
              listed="$(gh api --paginate "$runs?status=$status&per_page=100")" || return 1
              listed="$(jq -r '.workflow_runs[].id' <<<"$listed")" || return 1
              seen+="$listed"$'\n'
            done
            mapfile -t run_ids < <(sort -u <<<"$seen")
            for id in "${run_ids[@]}"; do
              if [[ -z "$id" || "$id" == "$GITHUB_RUN_ID" ]]; then continue; fi
              [[ "$id" =~ ^[0-9]+$ ]] || return 1
              jobs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?filter=latest&per_page=100")" || return 1
              matched="$(jq -s '[.[].jobs[] | select(.name == "test (winguest)" and (.status == "queued" or .status == "in_progress"))] | length' <<<"$jobs")" || return 1
              [[ "$matched" =~ ^[0-9]+$ ]] || return 1
              count=$((count + matched))
            done
            echo "$count"
          }
          home=guest
          if [[ "${WINGUEST_BUSY:-}" == "1" ]]; then
            home=hosted
            echo "WINGUEST_BUSY is 1, so the queue for the guest was not counted."
          elif [[ ! "${WINGUEST_QUEUE_LIMIT:-}" =~ ^0*[1-9][0-9]{0,5}$ ]]; then
            echo "WINGUEST_BUSY is not 1, and WINGUEST_QUEUE_LIMIT is unset or not a positive whole number, so routing on the queue is off and the queue for the guest was not counted."
          else
            limit=$((10#$WINGUEST_QUEUE_LIMIT))
            echo "WINGUEST_BUSY is not 1. WINGUEST_QUEUE_LIMIT is $limit."
            if count="$(winguest_jobs)"; then
              echo "Other runs of this workflow have $count 'test (winguest)' jobs queued or in progress."
              if (( count >= limit )); then home=hosted; fi
            else
              echo "The GitHub API could not be read, so the queue for the guest is unknown. A failed question does not move a run off the guest."
            fi
          fi
          echo "home: $home"
          echo "home=$home" >> "$GITHUB_OUTPUT"

  # The Windows suite runs on an ephemeral self-hosted runner: a throwaway
  # overlay of a frozen Server 2025 image on the build box, one job per boot,
  # registered for that job with a single-use just-in-time config
  # (MAINTAINING.md step 3). A pull request, a push to master and a
  # merge-queue entry all run it there, on the same three labels, unless the
  # run's `pick-windows-home` answers `hosted` -- WINGUEST_BUSY is `1`, or
  # WINGUEST_QUEUE_LIMIT is set and the guest's queue has reached it, both
  # opt-in and neither set by default. Then this job is skipped
  # and `test-windows-hosted` below runs the same suite on windows-latest;
  # the aggregate requires exactly one of the two to succeed. Measured
  # 2026-09-15/16: five hosted samples of the suite on windows-latest (run
  # 34980597250, at 126b8832) took 1122-1499 s in the harness, 21m 30s to
  # 28m 03s a job; the guest, on three green runs of pull request #299, took
  # 346 s in the harness, 6m 47s to 6m 55s a job -- three to four times
  # faster. From 2026-09-16 a merge-queue entry ran on windows-latest
  # instead, under a 45-minute timeout and then a 55-minute one. In October
  # 2026 three queue entries of one head reached the 45 minutes and two of
  # the next head reached the 55, each cancelled before its suite reported a
  # complete result, while the guest ran the full suite of the tree the
  # second of those two entries tested, as a pull request (run 40263568079),
  # inside its own 20-minute timeout. So the queue runs on the guest again.
  # That is a scheduling repair: it names no cause for the hosted runs, and
  # it repairs no test. One guest serves every lane, so a queue entry's leg
  # waits for it behind any build that holds it, up to the queue limit where
  # the operator has set one; and
  # a run the guest takes runs the composed commit on the machine every pull
  # request runs on, where the hosted queue left a test whose outcome depends
  # on the machine to be seen first by the push to master. A run sent to the
  # hosted twin reopens that gap for itself. `lint (windows)` and the Windows
  # MSRV leg stay on windows-latest, and `lint (windows)` also links every
  # binary and test harness with `cargo build --all-targets`, so GitHub's
  # runner still compiles, code-generates and links every `#[cfg(windows)]`
  # body on current stable on every lane. Every step of every job here is a
  # pinned action or a pinned script: an unpinned step could check out
  # another tree first.
  #
  # The guest's image carries the toolchain and a pre-warmed target
  # directory, so there is no install step and no cache step, and the
  # workflow oracle refuses a toolchain install in this job: the image
  # selects the compiler, re-curation moves it, and the suite step below
  # refuses to run on any other. The timeout is the guest's 20 minutes on
  # every lane.
  test-windows:
    name: test (winguest)
    runs-on: [self-hosted, windows, winguest]
    needs: pick-windows-home
    if: needs.pick-windows-home.outputs.home == 'guest'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure git identity
        run: |
          git config --global user.email "ci@upstroke.local"
          git config --global user.name "upstroke CI"

      # The suite, and a witness that it ran. A green `cargo test` is not that
      # claim. A `target.<triple>.runner` bound in a `.cargo/config.toml`, in
      # `$CARGO_HOME`, in a directory above the checkout or in the process
      # environment makes Cargo compile every harness and hand each one to a
      # wrapper that exits zero; a `[workspace]` in the root manifest whose
      # `default-members` name another crate makes it build no harness of this
      # one at all. Each is a green job over a suite that never ran, each is
      # written somewhere a check reading this repository cannot see, and the
      # list is not closed -- Cargo has more ways to be told this than anyone
      # will enumerate. Counting what libtest itself reported refuses the
      # effect instead of the causes: a suite that did not execute has no
      # `test result: ok.` line to count. This is the one leg whose execution
      # leaves GitHub's runners, so it is the leg that has to say so. The
      # floor is today's count on this platform less a margin; removing that
      # many tests is a deliberate act, and it edits this number in the same
      # change.
      #
      # First, though, the compiler. No step in this job installs one: the
      # guest's image carries it, and what the image carries and the guest's
      # environment selects is not something a reader of this file can see.
      # And the `rustc` on PATH is not the question: Cargo picks its
      # compiler through `RUSTC`, `CARGO_BUILD_RUSTC` or a `build.rustc` in
      # any config it reads, none of which this workflow can see. So the
      # script asks Cargo itself -- `cargo rustc --lib -- --version` runs the
      # compiler Cargo would run, and prints its version. The `rustc` on PATH
      # is a second question, not a substitute: the suite's own fixtures spawn
      # bare `rustc` against what Cargo built (`effects::tests`, the log and
      # run-directory tests), and a PATH rustc of another version fails them
      # with an incompatible-rlib error rather than a wrong answer. So the
      # script asks all three -- Cargo's compiler, PATH's rustc, PATH's cargo
      # -- and refuses to run the suite unless every one is the image's: it
      # asserts what the image carries and the guest's environment selects,
      # and the workflow oracle holds the number in this script to the one it
      # pins as the image's. Re-curation edits both together.
      - name: Test, and witness that the suite ran
        env:
          UPSTROKE_TEST_TEMP_FOLDS_CASE: "1"
        run: |
          $rustc = ((cargo rustc -q --lib -- --version) | Out-String).Trim(); $path_rustc = ((rustc --version) | Out-String).Trim(); $cargo = ((cargo --version) | Out-String).Trim()
          if ($rustc -notmatch '^rustc 1\.97\.1 ' -or $path_rustc -notmatch '^rustc 1\.97\.1 ' -or $cargo -notmatch '^cargo 1\.97\.1 ') { throw "the suite would run on '$rustc' (Cargo's compiler), '$path_rustc' (PATH's rustc) and '$cargo', not the image's 1.97.1: a compiler was chosen by something other than this workflow" }
          cargo test --all-targets --all-features | Tee-Object -Variable log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $passed = [int](($log | Select-String -Pattern '^test result: ok\. (\d+) passed' | ForEach-Object { [int]$_.Matches[0].Groups[1].Value } | Measure-Object -Sum).Sum)
          if ($passed -lt 1700) { throw "the suite reported $passed passing tests, below the floor of 1700: Cargo compiled the harnesses and executed almost none of them" }

      # The native HOST acceptance record on the guest: the `test` job's
      # selection under PowerShell, on the compiler the step above has just
      # asserted, and the harness that step built. `$LASTEXITCODE` carries
      # Cargo's exit through `Tee-Object`, as it does in the suite step. The
      # step refuses unless exactly the record's test ran and passed, and
      # refuses a missing or incomplete frame: BEGIN first, END last with the
      # same summary, and chunk k at position k with the tag and its exact
      # length. The workflow oracle pins the script and its case-fold map
      # whole, immediately after the suite-and-witness step.
      - name: Capture the native host acceptance record
        env:
          UPSTROKE_TEST_TEMP_FOLDS_CASE: "1"
        run: |
          cargo test --all-features --lib engine::tests::host_acceptance_record -- --ignored --exact --nocapture | Tee-Object -Variable capture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($capture -ccontains 'test engine::tests::host_acceptance_record ... ok') -or -not ($capture -cmatch '^test result: ok\. 1 passed; 0 failed; 0 ignored; ')) { throw "the capture did not run exactly the one host acceptance test to a pass" }
          $f = @($capture | Where-Object { $_ -cmatch '^UPSTROKE-HOST-ACCEPTANCE-RECORD ' } | ForEach-Object { ,($_ -split ' ') })
          $ok = $f.Count -ge 3 -and $f[0].Count -eq 7 -and $f[-1].Count -eq 7 -and $f[0][1] -ceq 'v1' -and $f[0][2] -ceq 'BEGIN' -and $f[-1][1] -ceq 'v1' -and $f[-1][2] -ceq 'END' -and ($f[0][3..6] -join ' ') -ceq ($f[-1][3..6] -join ' ') -and $f[0][4] -ceq "$($f.Count - 2)"
          for ($k = 1; $ok -and $k -lt $f.Count - 1; $k++) { $ok = $f[$k].Count -eq 5 -and $f[$k][1] -ceq 'v1' -and $f[$k][2] -ceq $f[0][3] -and $f[$k][3] -ceq "$k" -and $f[$k][4].Length -eq $(if ($k -lt $f.Count - 2) { 192 } else { 2 * ([long]$f[0][5] - ([long]$f[0][4] - 1) * 96) }) }
          if (-not $ok) { throw "the host acceptance record is missing or its framing is incomplete" }

      # The container capability observation on the guest: the `test` job's
      # selection under PowerShell, on the compiler the suite step asserted
      # and the harness it built, immediately after the host acceptance
      # capture. `$LASTEXITCODE` carries Cargo's exit through `Tee-Object`.
      # The step refuses unless exactly the observation's test ran and
      # passed, and refuses a missing or incomplete frame, as the capture
      # above does for its record. Every capability class passes; the record
      # is decoded from this log, and a class is not M2 acceptance. Four
      # minutes, and no environment of its own; the workflow oracle pins the
      # script and its case-fold map whole.
      - name: Capture the container capability observation
        timeout-minutes: 4
        env:
          UPSTROKE_TEST_TEMP_FOLDS_CASE: "1"
        run: |
          cargo test --all-features --lib runner::container::tests::container_capability_record -- --ignored --exact --nocapture | Tee-Object -Variable capture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($capture -ccontains 'test runner::container::tests::container_capability_record ... ok') -or -not ($capture -cmatch '^test result: ok\. 1 passed; 0 failed; 0 ignored; ')) { throw "the observation did not run exactly the one container capability test to a pass" }
          $f = @($capture | Where-Object { $_ -cmatch '^UPSTROKE-CONTAINER-CAPABILITY-RECORD ' } | ForEach-Object { ,($_ -split ' ') })
          $ok = $f.Count -ge 3 -and $f[0].Count -eq 7 -and $f[-1].Count -eq 7 -and $f[0][1] -ceq 'v1' -and $f[0][2] -ceq 'BEGIN' -and $f[-1][1] -ceq 'v1' -and $f[-1][2] -ceq 'END' -and ($f[0][3..6] -join ' ') -ceq ($f[-1][3..6] -join ' ') -and $f[0][4] -ceq "$($f.Count - 2)"
          for ($k = 1; $ok -and $k -lt $f.Count - 1; $k++) { $ok = $f[$k].Count -eq 5 -and $f[$k][1] -ceq 'v1' -and $f[$k][2] -ceq $f[0][3] -and $f[$k][3] -ceq "$k" -and $f[$k][4].Length -eq $(if ($k -lt $f.Count - 2) { 192 } else { 2 * ([long]$f[0][5] - ([long]$f[0][4] - 1) * 96) }) }
          if (-not $ok) { throw "the container capability record is missing or its framing is incomplete" }

  # The Windows suite's hosted twin, for a run `pick-windows-home` sends off
  # the guest. Its suite step is the guest's, character for character: the
  # three compiler questions, the suite, its exit and the count of passing
  # tests against the same floor. It differs only where GitHub's image
  # differs from the guest's. No image carries the compiler here, so step 1
  # installs the image's, `1.97.1`, not `stable`. Current stable is ahead of
  # the image (`lint (windows)` installed 1.98.1 on 2026-09-16), so `stable`
  # here would run the suite on a compiler the guest never ran it on: a test
  # whose outcome depends on the compiler -- a version-gated test, a std
  # change to Windows process spawning, which this suite's `cmd /C` quoting
  # and PATHEXT tests exercise, a new lint in test code under the
  # workflow-wide `-D warnings` -- would pass on one home and fail on the
  # other according to how busy the guest was. The pin keeps the two homes
  # one compiler, as it kept the hosted merge-queue lane and the guest one
  # compiler until that lane went (d3434ace). The toolchain action tolerates
  # a failed `rustup default` and then verifies only `rustc +1.97.1`, so the
  # install can report success while bare `cargo` is still the runner's
  # preinstalled stable; the suite step's three questions refuse that here
  # as they do on the guest, and the workflow oracle holds the install and
  # the questions to the one version it pins as the image's. Re-curation
  # edits both. The first question compiles the dependencies, which the
  # suite would compile next anyway. `clippy` is a test dependency here, as
  # in `test` above. No cache step, for the reason the hosted merge-queue
  # lane carried none: a run restores caches from its own ref or the default
  # branch, a queue entry's ref is a fresh `gh-readonly-queue/` branch, and
  # `master` saves a twin cache only on a push the picker itself sent here,
  # so nearly every run would start cold and then upload, inside its 55
  # minutes, a cache nothing later reads; the workflow oracle refuses one
  # here. A pull request sent here twice is the one run that would gain.
  # The host acceptance capture and the container capability observation
  # follow the suite as they do on the guest: neither depends on the guest's
  # image -- each runs the test it names and checks its frame, and every
  # capability class passes, an absent Docker included. What the pin does
  # not remove is the machine: GitHub's image, filesystem, temporary
  # directory and services are not the guest's, so a test whose outcome
  # depends on the machine can still pass here and fail there.
  #
  # 55 minutes, the ceiling the hosted Windows suite last ran under. This job
  # inherits that suite's risk: it took 21 to 28 minutes a job in September
  # 2026, and in October several merge-queue entries reached 45 and then 55
  # minutes and were cancelled, the cause unknown (the comment above
  # `test-windows`). Splitting the suite into shards, as draft pull request
  # #339 proposed, is not done here.
  test-windows-hosted:
    name: test (windows-latest)
    runs-on: windows-latest
    needs: pick-windows-home
    if: needs.pick-windows-home.outputs.home == 'hosted'
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install the image's toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: clippy

      - name: Configure git identity
        run: |
          git config --global user.email "ci@upstroke.local"
          git config --global user.name "upstroke CI"

      - name: Test, and witness that the suite ran
        env:
          UPSTROKE_TEST_TEMP_FOLDS_CASE: "1"
        run: |
          $rustc = ((cargo rustc -q --lib -- --version) | Out-String).Trim(); $path_rustc = ((rustc --version) | Out-String).Trim(); $cargo = ((cargo --version) | Out-String).Trim()
          if ($rustc -notmatch '^rustc 1\.97\.1 ' -or $path_rustc -notmatch '^rustc 1\.97\.1 ' -or $cargo -notmatch '^cargo 1\.97\.1 ') { throw "the suite would run on '$rustc' (Cargo's compiler), '$path_rustc' (PATH's rustc) and '$cargo', not the image's 1.97.1: a compiler was chosen by something other than this workflow" }
          cargo test --all-targets --all-features | Tee-Object -Variable log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $passed = [int](($log | Select-String -Pattern '^test result: ok\. (\d+) passed' | ForEach-Object { [int]$_.Matches[0].Groups[1].Value } | Measure-Object -Sum).Sum)
          if ($passed -lt 1700) { throw "the suite reported $passed passing tests, below the floor of 1700: Cargo compiled the harnesses and executed almost none of them" }

      - name: Capture the native host acceptance record
        env:
          UPSTROKE_TEST_TEMP_FOLDS_CASE: "1"
        run: |
          cargo test --all-features --lib engine::tests::host_acceptance_record -- --ignored --exact --nocapture | Tee-Object -Variable capture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($capture -ccontains 'test engine::tests::host_acceptance_record ... ok') -or -not ($capture -cmatch '^test result: ok\. 1 passed; 0 failed; 0 ignored; ')) { throw "the capture did not run exactly the one host acceptance test to a pass" }
          $f = @($capture | Where-Object { $_ -cmatch '^UPSTROKE-HOST-ACCEPTANCE-RECORD ' } | ForEach-Object { ,($_ -split ' ') })
          $ok = $f.Count -ge 3 -and $f[0].Count -eq 7 -and $f[-1].Count -eq 7 -and $f[0][1] -ceq 'v1' -and $f[0][2] -ceq 'BEGIN' -and $f[-1][1] -ceq 'v1' -and $f[-1][2] -ceq 'END' -and ($f[0][3..6] -join ' ') -ceq ($f[-1][3..6] -join ' ') -and $f[0][4] -ceq "$($f.Count - 2)"
          for ($k = 1; $ok -and $k -lt $f.Count - 1; $k++) { $ok = $f[$k].Count -eq 5 -and $f[$k][1] -ceq 'v1' -and $f[$k][2] -ceq $f[0][3] -and $f[$k][3] -ceq "$k" -and $f[$k][4].Length -eq $(if ($k -lt $f.Count - 2) { 192 } else { 2 * ([long]$f[0][5] - ([long]$f[0][4] - 1) * 96) }) }
          if (-not $ok) { throw "the host acceptance record is missing or its framing is incomplete" }

      - name: Capture the container capability observation
        timeout-minutes: 4
        env:
          UPSTROKE_TEST_TEMP_FOLDS_CASE: "1"
        run: |
          cargo test --all-features --lib runner::container::tests::container_capability_record -- --ignored --exact --nocapture | Tee-Object -Variable capture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($capture -ccontains 'test runner::container::tests::container_capability_record ... ok') -or -not ($capture -cmatch '^test result: ok\. 1 passed; 0 failed; 0 ignored; ')) { throw "the observation did not run exactly the one container capability test to a pass" }
          $f = @($capture | Where-Object { $_ -cmatch '^UPSTROKE-CONTAINER-CAPABILITY-RECORD ' } | ForEach-Object { ,($_ -split ' ') })
          $ok = $f.Count -ge 3 -and $f[0].Count -eq 7 -and $f[-1].Count -eq 7 -and $f[0][1] -ceq 'v1' -and $f[0][2] -ceq 'BEGIN' -and $f[-1][1] -ceq 'v1' -and $f[-1][2] -ceq 'END' -and ($f[0][3..6] -join ' ') -ceq ($f[-1][3..6] -join ' ') -and $f[0][4] -ceq "$($f.Count - 2)"
          for ($k = 1; $ok -and $k -lt $f.Count - 1; $k++) { $ok = $f[$k].Count -eq 5 -and $f[$k][1] -ceq 'v1' -and $f[$k][2] -ceq $f[0][3] -and $f[$k][3] -ceq "$k" -and $f[$k][4].Length -eq $(if ($k -lt $f.Count - 2) { 192 } else { 2 * ([long]$f[0][5] - ([long]$f[0][4] - 1) * 96) }) }
          if (-not $ok) { throw "the container capability record is missing or its framing is incomplete" }

  msrv:
    name: msrv (Rust 1.85, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --locked --all-targets --all-features

  # The effect denylist is rustc-resolved, so it only denies what the compiler
  # actually compiles — and `lint` below is `ubuntu-latest`, which never compiles
  # a `#[cfg(windows)]` body at all. Measured (`PR5-CONF-014`): a raw
  # `std::fs::write` in a non-allowlisted module passes Ubuntu clippy, the test
  # job on all three platforms and the msrv job on all three platforms when it is
  # placed under `#[cfg(windows)]`, and is refused with the `UPSTROKE-EFFECT R21/R18`
  # note by MSVC clippy. So without this job `expected_failures_refusals[5]` and
  # `[6]` are undischarged for the Windows half of the tree.
  #
  # A separate job rather than a step in a test job, deliberately: the
  # Windows suite job that ran, `test-windows` or its hosted twin, is the
  # attestation of record for the Windows suite and a lint failure must not
  # be able to masquerade as a test failure in it. This
  # leg stays on windows-latest on every lane, on purpose: GitHub's runner
  # remains the neutral witness that the Windows tree compiles clean, and its
  # second step, `cargo build --all-targets`, makes it the witness that the
  # tree code-generates and links on current stable too, library, binaries and
  # test harnesses alike -- `cargo check` and Clippy stop before codegen, and
  # both Windows suite jobs, the guest and its hosted twin, link with the
  # image's toolchain, which moves only by re-curation. In the dev
  # profile, which is the profile every CI leg here builds; `release.yml` builds
  # the shipped artifact with `--release`. The two steps fail separately and the
  # log names which.
  lint-windows:
    name: lint (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # Pinned by the workflow oracle as `WINDOWS_BUILD_WITNESS`, exactly once
      # on exactly one windows-latest job; a substring reading is not the check.
      # `build --all-targets`, not `test --no-run`: the latter links only
      # test-profile artifacts, so a `#[cfg(all(windows, not(test)))]` body in
      # a binary would never be linked here.
      - run: cargo build --all-targets --all-features

  # PR5-MACOS-CLIPPY-NEVER-RUN. Ubuntu Clippy configures out every
  # `#[cfg(target_os = "macos")]` region and the Windows leg configures out the
  # same; macOS ran tests and MSRV but never Clippy. So a denied call — an
  # `.expect()` in the macOS `create_cloexec_pipe`, for instance — could ship
  # with every required check green. This leg is the whole repair.
  lint-macos:
    name: lint (macos)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: bash .github/scripts/test-release-record.sh
      - run: bash .github/scripts/test-pr-policy.sh
      - run: bash .github/scripts/test-pr-ledger-evidence.sh
      - run: bash .github/scripts/test-docs-consistency.sh
      - run: bash .github/scripts/test-internals-notes.sh
      # The audit gate's decode probe reads CPython's own bytecode, and every
      # answer the gate asserts of it was measured on CPython 3.12. When this
      # job's image moved from ubuntu-24.04 to ubuntu-26.04, whose inventories
      # list Python 3.12.3 and 3.14.4, the unchanged gate printed 45 failures.
      # The job did not print its interpreter; a private CPython 3.14.4 build
      # prints the same 45 lines, and 3.12 passes. So the gate runs that probe
      # on `python3.12`, refusing one that is not CPython 3.12, and this step
      # puts one on PATH; the rest of the gate runs on the image's `python3`.
      # Moving the version re-measures the gate's expectations in the same
      # change. The workflow oracle allows this action one input.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: bash .github/scripts/test-pr-ready-audit.sh

  # Branch protection requires this one deliberately stable context. Keeping
  # the external rule pointed at an aggregate means adding a platform or
  # splitting a gate cannot silently leave GitHub protecting yesterday's job
  # names. `always()` makes a failed or cancelled dependency produce a failed
  # aggregate instead of a missing required check that never settles. Every
  # gate must succeed except the two Windows suite jobs, of which
  # `pick-windows-home` sends a run to one: exactly one of those must succeed
  # and the other be skipped, so both skipped, both run, or either failed or
  # cancelled is red.
  merge-gate:
    name: upstroke-ci
    if: always()
    needs: [lint, lint-windows, lint-macos, msrv, pick-windows-home, test, test-windows, test-windows-hosted]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every gate
        shell: bash
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          LINT_WINDOWS_RESULT: ${{ needs.lint-windows.result }}
          LINT_MACOS_RESULT: ${{ needs.lint-macos.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
          PICK_WINDOWS_HOME_RESULT: ${{ needs.pick-windows-home.result }}
          TEST_RESULT: ${{ needs.test.result }}
          TEST_WINDOWS_RESULT: ${{ needs.test-windows.result }}
          TEST_WINDOWS_HOSTED_RESULT: ${{ needs.test-windows-hosted.result }}
        run: |
          failed=0
          windows=""
          for gate in LINT LINT_WINDOWS LINT_MACOS MSRV PICK_WINDOWS_HOME TEST TEST_WINDOWS TEST_WINDOWS_HOSTED; do
            result_var="${gate}_RESULT"
            result="${!result_var}"
            if [[ "$gate" == "TEST_WINDOWS" || "$gate" == "TEST_WINDOWS_HOSTED" ]]; then
              windows+="$gate=$result "
            elif [[ "$result" != "success" ]]; then
              echo "$gate did not succeed: $result" >&2
              failed=1
            fi
          done
          case "$windows" in
            "TEST_WINDOWS=success TEST_WINDOWS_HOSTED=skipped " | "TEST_WINDOWS=skipped TEST_WINDOWS_HOSTED=success ") ;;
            *)
              echo "exactly one Windows suite job must succeed and the other be skipped: $windows" >&2
              failed=1
              ;;
          esac
          exit "$failed"
