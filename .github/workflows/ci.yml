name: CI

on:
  # `master` is the only base. The parallel-execution design's integration
  # branch, `codex/parallelism-design`, was deleted once its slices had landed;
  # standing another one up means adding its name to every branch list here and
  # in pr-policy.yml, and to the gate that pins them, in one change
  # (MAINTAINING.md, Repository rules).
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, edited, synchronize, reopened]
  # The merge queue builds each entry on the head of its base plus the entries
  # queued ahead of it, and lands exactly the commit these contexts passed on;
  # a branch is never brought up to date by hand to merge (MAINTAINING.md,
  # Repository rules). The concurrency key below is `github.ref` for this
  # event, one queue branch per entry, so entries never cancel each other.
  merge_group:
    types: [checks_requested]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.shard == 'all' && matrix.os || format('{0}, {1}', matrix.os, matrix.shard) }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Windows is the first-class target (DESIGN.md §1) and its suite is not
        # an afterthought: the subprocess supervisor, the cmd /C quoting and the
        # PATHEXT resolution all behave differently per platform and are covered
        # by tests. It is absent from this matrix because it runs below, in
        # `test-windows`, on a runner chosen by lane; these legs stay on
        # GitHub's runners.
        #
        # The ubuntu leg runs the whole suite. The macOS suite runs as three
        # shards, `m1` to `m3`, on every lane: the macOS leg of pull request
        # #339's second merge-queue entry was cancelled at this job's 30
        # minutes, and the ceiling is unchanged. `.github/scripts/partition.table`
        # holds each shard's libtest name filters, and `test-coverage` fails the
        # run unless the three shards ran every test the macOS harnesses listed
        # exactly once. No duration is claimed for a shard before one is
        # measured. The workflow oracle derives this list from that table.
        include:
          - os: ubuntu-latest
            shard: all
          - os: macos-latest
            shard: m1
          - os: macos-latest
            shard: m2
          - os: macos-latest
            shard: m3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          # `clippy` is a TEST dependency here, not only a lint one. PR5's
          # `expected_failures_refusals[6]` is "a disallowed primitive or
          # effectful wrapper outside an allowlisted module fails clippy", and
          # `effects::tests::every_declared_effect_denial_refuses_for_the_reason_
          # it_declares` discharges it by compiling one fixture per resolution
          # shape with `clippy-driver`. `dtolnay/rust-toolchain` installs the
          # minimal profile, so without this the fixtures could not run in the
          # job that runs the tests — which is `PR5-C-DOCTEST-FIXTURES-NEVER-RAN`
          # one step removed.
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The engine shells out to git and asserts on its output; runners have
      # git but no identity, and several tests commit.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@upstroke.local"
          git config --global user.name "upstroke CI"

      # `the_temporary_object_scan_resolves_case_aliases_as_the_filesystem_does`
      # requires its native casefold branch only where the leg declares that
      # the temporary directory its suite runs under folds case; anywhere
      # else -- the ubuntu leg, a developer's TMPDIR on case-sensitive APFS --
      # it observes the branch instead of failing it. The macOS runner's
      # temporary directory folds case and the ubuntu runner's does not, so
      # the declaration is per leg, and `test-windows` makes the same
      # declaration for the guest's NTFS. The workflow oracle pins this one
      # step-level `env:` as a whole map (`TEST_STEP_ENV`), the way it pins
      # the aggregate's: any other key here is refused.
      - run: cargo test --all-targets --all-features
        if: matrix.shard == 'all'
        env:
          UPSTROKE_TEST_TEMP_FOLDS_CASE: ${{ matrix.os == 'macos-latest' && '1' || '' }}

      # A shard leg runs the suite through `.github/scripts/partition.py`, not
      # with the step above's argv: it asks Cargo for the package's targets
      # (`cargo metadata`), builds every target once (`cargo test --all-targets
      # --all-features --no-run`, with JSON artifact messages), then lists,
      # lists the ignored tests of, lists the selection of and runs each test
      # unit by its own selector (`--lib` or `--<kind> <name>`), adding after
      # `--` only this shard's libtest filters and, on the run, a per-unit
      # `--logfile`. It records what the build reported and what each harness
      # listed, selected and ran, for `test-coverage` to check. The two steps'
      # conditions are complements, so every leg runs exactly one of them, and
      # the oracle pins both conditions and both scripts whole. The record is
      # uploaded under the run attempt, so a re-run uploads beside an earlier
      # attempt's record rather than colliding with it; `test-coverage` reads
      # only its own attempt's.
      - name: Test one shard, and record what it listed, selected and ran
        if: matrix.shard != 'all'
        env:
          UPSTROKE_TEST_TEMP_FOLDS_CASE: ${{ matrix.os == 'macos-latest' && '1' || '' }}
        run: python3 .github/scripts/partition.py run macos ${{ matrix.shard }} test-partition

      - name: Upload the shard's record
        if: matrix.shard != 'all'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-partition-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: test-partition
          if-no-files-found: error

  # The Windows suite runs on one of two machines, chosen by lane. A
  # pull-request or push build runs on an ephemeral self-hosted runner: a
  # throwaway overlay of a frozen Server 2025 image on the build box, one job
  # per boot, registered for that job with a single-use just-in-time config
  # (MAINTAINING.md step 3). Measured 2026-09-15/16: five hosted samples of
  # the suite on windows-latest (run 34980597250, at 126b8832) took 1122-1499 s
  # in the harness, 21m 30s to 28m 03s a job; the guest, on three green runs of
  # pull request #299, took 346 s in the harness, 6m 47s to 6m 55s a job --
  # three to four times faster. A pull request waits on this leg
  # interactively, so it keeps the guest. A merge-queue entry runs on
  # windows-latest: nothing waits on the queue interactively, six to ten
  # merges a day are a tenth to a sixth of what a serial lane at 25 minutes
  # an entry can take in a day (57), bursts queue rather than fail, and moving
  # it lets the queue's guest be retired from a box where
  # two guests and the builds contend for the same cores -- one guest leg went
  # from 6m to 10m 38s under that load. What the hosted queue run does not
  # prove is behaviour that differs between the two machines -- what the
  # runner environment reports, what the image carries; a test that passes on
  # windows-latest in the queue and fails on the guest is seen first by the
  # push to master, which runs the guest. `lint (windows)` and the Windows MSRV
  # leg stay on windows-latest, and `lint (windows)` also links every binary
  # and test harness with `cargo build --all-targets`, so GitHub's runner still
  # compiles, code-generates and links every `#[cfg(windows)]` body on current
  # stable on every lane. Every step of every job here is a pinned action or a
  # pinned script: an unpinned step could check out another tree first.
  #
  # The guest's image carries the toolchain and a pre-warmed target directory,
  # so its lane skips the install step and there is no cache step. The hosted
  # lane installs the compiler the image carries, `1.97.1`, not `stable`.
  # Current stable is ahead of the image (`lint (windows)` installs 1.98.1
  # today), so `stable` here would run the suite on a compiler the
  # pull-request lane never ran it on: a test whose outcome depends on the
  # compiler -- a version-gated test, a std behaviour change, a new lint in
  # test code under the workflow-wide `-D warnings` -- passes on one lane and
  # fails on the other. The pin keeps the two test lanes one compiler. It does
  # not shield the queue from stable moving, and nothing here does:
  # `lint (windows)` runs at `stable` on both events and is required by
  # `merge-gate`, so a stable that adds a lint between a pull request's green
  # and its enqueue ejects the entry through that leg, exactly as before this
  # change. The pin is re-set when the image is re-curated. `components:
  # clippy` is a test dependency here, as in `test` above. The skipped step
  # is not free on the guest: the runner resolves and downloads every `uses:`
  # archive during job setup, before any `if:` is evaluated, so the guest lane
  # now depends on GitHub serving two action archives rather than one
  # (`actions/checkout` was already one), and a download failure fails the job
  # before the skipped step -- an availability dependency of the kind the lane
  # already had, taken as the price of one job for both lanes. No cache step on
  # either lane: a run restores caches from its own ref or the default branch,
  # a queue entry's ref is a fresh `gh-readonly-queue/` branch, and no run on
  # `master` ever saves a hosted `test-windows` cache, so a cache step would
  # upload a cache per entry that no later entry could read. The hosted
  # lane's cancellation ceiling is 55 minutes. Three completed queue samples
  # took 40.4, 42.0 and 44.5 minutes a job (runs 38185230422, 38191303862 and
  # 38202717688), and 55 is about 1.24 times the slowest; two other queue runs,
  # 38199038253 and 38245576405, were cancelled at the earlier 45-minute limit
  # and are incomplete, their cause unknown. The default branch's ruleset gives
  # the queue its own `check_response_timeout_minutes` of 60, and this ceiling
  # leaves a nominal 5-minute interval beneath it, so neither the entry's
  # completion nor a full 55 minutes for this job is guaranteed. Raised from
  # 45, the ceiling may hold the job up to 10 minutes longer, and it neither
  # diagnoses nor cures a hang. The guest keeps its own 20.
  #
  # On the merge-queue lane the hosted suite now runs as four shards, `w1` to
  # `w4`, each a leg of this matrix under that same 55-minute ceiling, and
  # `test-coverage` fails the run unless the four ran every test the hosted
  # Windows harnesses listed exactly once (`.github/scripts/partition.table`
  # holds their libtest name filters). Two queue entries of pull request #339
  # were cancelled at 55 minutes with the whole suite on one hosted leg. No
  # shard duration is claimed before one is measured, and nothing here makes
  # GitHub start the four legs together. The pull-request and push lanes keep
  # one leg, the guest's whole suite, named `test (winguest)` as before. The
  # machine follows the leg: `all` runs on the guest and every shard on
  # windows-latest, so `runs-on:`, the ceiling and the install step are keyed
  # on the shard, and the lane decides only which legs exist.
  test-windows:
    name: test (${{ matrix.shard == 'all' && 'winguest' || format('windows-latest, {0}', matrix.shard) }})
    runs-on: ${{ matrix.shard != 'all' && 'windows-latest' || fromJSON('["self-hosted", "windows", "winguest"]') }}
    timeout-minutes: ${{ matrix.shard != 'all' && 55 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'merge_group' && '["w1", "w2", "w3", "w4"]' || '["all"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The hosted lane's compiler: the image's, exactly. The workflow oracle
      # pins this step whole -- one install, right after the checkout, on
      # exactly the legs whose runner needs one, at exactly the image's
      # version. On the guest's leg the step is skipped after its archive is
      # downloaded at setup.
      - name: Install the image's toolchain on the hosted lane
        if: matrix.shard != 'all'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: clippy

      - name: Configure git identity
        run: |
          git config --global user.email "ci@upstroke.local"
          git config --global user.name "upstroke CI"

      # The suite, and a witness that it ran. A green `cargo test` is not that
      # claim. A `target.<triple>.runner` bound in a `.cargo/config.toml`, in
      # `$CARGO_HOME`, in a directory above the checkout or in the process
      # environment makes Cargo compile every harness and hand each one to a
      # wrapper that exits zero; a `[workspace]` in the root manifest whose
      # `default-members` name another crate makes it build no harness of this
      # one at all. Each is a green job over a suite that never ran, each is
      # written somewhere a check reading this repository cannot see, and the
      # list is not closed -- Cargo has more ways to be told this than anyone
      # will enumerate. Counting what libtest itself reported refuses the
      # effect instead of the causes: a suite that did not execute has no
      # `test result: ok.` line to count. This is the one leg whose execution
      # leaves GitHub's runners on the pull-request lane, so it is the leg
      # that has to say so, and the witness runs on both lanes: the count is
      # the same claim on either machine. The floor is today's count on this
      # platform less a margin; removing that many tests is a deliberate act,
      # and it edits this number in the same change.
      #
      # First, though, the compiler. The toolchain action above tolerates a
      # failed `rustup default` (`continue-on-error` on that step) and then
      # verifies only `rustc +1.97.1`, so on the hosted lane the install can
      # report success while bare `cargo` is still the runner's preinstalled
      # stable. And the `rustc` on PATH is not the question: Cargo picks its
      # compiler through `RUSTC`, `CARGO_BUILD_RUSTC` or a `build.rustc` in
      # any config it reads, none of which this workflow can see. So the
      # script asks Cargo itself -- `cargo rustc --lib -- --version` runs the
      # compiler Cargo would run, and prints its version. The `rustc` on PATH
      # is a second question, not a substitute: the suite's own fixtures spawn
      # bare `rustc` against what Cargo built (`effects::tests`, the log and
      # run-directory tests), and a PATH rustc of another version fails them
      # with an incompatible-rlib error rather than a wrong answer. So the
      # script asks all three -- Cargo's compiler, PATH's rustc, PATH's cargo
      # -- and refuses to run the suite unless every one is the image's, on
      # either lane: the guest asserts what its image carries and its
      # environment selects, the hosted lane asserts what the install
      # selected, and the workflow oracle holds the number in this script to
      # the one it pins for the install. Re-curation edits both together. On
      # the hosted lane the first question compiles the dependencies, which
      # the suite would compile next anyway.
      - name: Test, and witness that the suite ran
        if: matrix.shard == 'all'
        env:
          UPSTROKE_TEST_TEMP_FOLDS_CASE: "1"
        run: |
          $rustc = ((cargo rustc -q --lib -- --version) | Out-String).Trim(); $path_rustc = ((rustc --version) | Out-String).Trim(); $cargo = ((cargo --version) | Out-String).Trim()
          if ($rustc -notmatch '^rustc 1\.97\.1 ' -or $path_rustc -notmatch '^rustc 1\.97\.1 ' -or $cargo -notmatch '^cargo 1\.97\.1 ') { throw "the suite would run on '$rustc' (Cargo's compiler), '$path_rustc' (PATH's rustc) and '$cargo', not the image's 1.97.1: a compiler was chosen by something other than this workflow" }
          cargo test --all-targets --all-features | Tee-Object -Variable log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $passed = [int](($log | Select-String -Pattern '^test result: ok\. (\d+) passed' | ForEach-Object { [int]$_.Matches[0].Groups[1].Value } | Measure-Object -Sum).Sum)
          if ($passed -lt 1700) { throw "the suite reported $passed passing tests, below the floor of 1700: Cargo compiled the harnesses and executed almost none of them" }

      # A hosted shard: the same compiler check, then the suite through
      # `.github/scripts/partition.py`, not with the step above's argv: it asks
      # Cargo for the package's targets (`cargo metadata`), builds every target
      # once (`cargo test --all-targets --all-features --no-run`, with JSON
      # artifact messages), then lists, lists the ignored tests of, lists the
      # selection of and runs each test unit by its own selector (`--lib` or
      # `--<kind> <name>`), adding after `--` only this shard's libtest filters
      # and, on the run, a per-unit `--logfile`, and records what the build
      # reported and what each harness listed, selected and ran. The witness's
      # count is not repeated here: `test-coverage` refuses the run unless the
      # shards together ran every listed test, and the table's floor for the
      # Windows group is the witness's 1700. The two steps' conditions are
      # complements, so every leg runs exactly one of them; the oracle pins
      # both conditions and both scripts whole.
      - name: Test one shard, and record what it listed, selected and ran
        if: matrix.shard != 'all'
        env:
          UPSTROKE_TEST_TEMP_FOLDS_CASE: "1"
        run: |
          $rustc = ((cargo rustc -q --lib -- --version) | Out-String).Trim(); $path_rustc = ((rustc --version) | Out-String).Trim(); $cargo = ((cargo --version) | Out-String).Trim()
          if ($rustc -notmatch '^rustc 1\.97\.1 ' -or $path_rustc -notmatch '^rustc 1\.97\.1 ' -or $cargo -notmatch '^cargo 1\.97\.1 ') { throw "the suite would run on '$rustc' (Cargo's compiler), '$path_rustc' (PATH's rustc) and '$cargo', not the image's 1.97.1: a compiler was chosen by something other than this workflow" }
          python .github/scripts/partition.py run windows ${{ matrix.shard }} test-partition
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the shard's record
        if: matrix.shard != 'all'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-partition-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: test-partition
          if-no-files-found: error

  msrv:
    name: msrv (Rust 1.85, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --locked --all-targets --all-features

  # The effect denylist is rustc-resolved, so it only denies what the compiler
  # actually compiles — and `lint` below is `ubuntu-latest`, which never compiles
  # a `#[cfg(windows)]` body at all. Measured (`PR5-CONF-014`): a raw
  # `std::fs::write` in a non-allowlisted module passes Ubuntu clippy, the test
  # job on all three platforms and the msrv job on all three platforms when it is
  # placed under `#[cfg(windows)]`, and is refused with the `UPSTROKE-EFFECT R21/R18`
  # note by MSVC clippy. So without this job `expected_failures_refusals[5]` and
  # `[6]` are undischarged for the Windows half of the tree.
  #
  # A separate job rather than a step in a test job, deliberately:
  # `test-windows` is the attestation of record for the Windows suite and a
  # lint failure must not be able to masquerade as a test failure in it. This
  # leg stays on windows-latest on every lane, on purpose: GitHub's runner
  # remains the neutral witness that the Windows tree compiles clean, and its
  # second step, `cargo build --all-targets`, makes it the witness that the
  # tree code-generates and links on current stable too, library, binaries and
  # test harnesses alike -- `cargo check` and Clippy stop before codegen, and
  # the test leg links with the image's toolchain on both lanes, which moves
  # only by re-curation. In the dev
  # profile, which is the profile every CI leg here builds; `release.yml` builds
  # the shipped artifact with `--release`. The two steps fail separately and the
  # log names which.
  lint-windows:
    name: lint (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # Pinned by the workflow oracle as `WINDOWS_BUILD_WITNESS`, exactly once
      # on exactly one windows-latest job; a substring reading is not the check.
      # `build --all-targets`, not `test --no-run`: the latter links only
      # test-profile artifacts, so a `#[cfg(all(windows, not(test)))]` body in
      # a binary would never be linked here.
      - run: cargo build --all-targets --all-features

  # PR5-MACOS-CLIPPY-NEVER-RUN. Ubuntu Clippy configures out every
  # `#[cfg(target_os = "macos")]` region and the Windows leg configures out the
  # same; macOS ran tests and MSRV but never Clippy. So a denied call — an
  # `.expect()` in the macOS `create_cloexec_pipe`, for instance — could ship
  # with every required check green. This leg is the whole repair.
  lint-macos:
    name: lint (macos)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: bash .github/scripts/test-release-record.sh
      - run: bash .github/scripts/test-pr-policy.sh
      - run: bash .github/scripts/test-pr-ledger-evidence.sh
      - run: bash .github/scripts/test-docs-consistency.sh
      - run: bash .github/scripts/test-internals-notes.sh
      - run: bash .github/scripts/test-pr-ready-audit.sh
      - run: bash .github/scripts/test-partition.sh

  # The partitioned legs' completeness. A shard's own green says only that the
  # tests its filters selected passed; this job says the shards of each
  # partitioned group, together, ran every test their harnesses listed, exactly
  # once. It has no `if:`, so a failed, cancelled or skipped leg skips it and
  # `merge-gate` reads `skipped`. It runs only the checked-out
  # `.github/scripts/partition.py` and the table beside it, and reads the
  # downloaded records as data: this run attempt's artifacts only, by pattern,
  # each bound by the leg to this checkout, this table, this run and this
  # attempt. A record from any other attempt is refused, not superseded, so a
  # re-run of only the failed legs cannot pass; a full re-run can.
  test-coverage:
    name: partition coverage
    needs: [test, test-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test-partition-*-attempt-${{ github.run_attempt }}
          path: test-partition-records
      - run: python3 .github/scripts/partition.py verify test-partition-records

  # Branch protection requires this one deliberately stable context. Keeping
  # the external rule pointed at an aggregate means adding a platform or
  # splitting a gate cannot silently leave GitHub protecting yesterday's job
  # names. `always()` makes a failed or cancelled dependency produce a failed
  # aggregate instead of a missing required check that never settles.
  merge-gate:
    name: upstroke-ci
    if: always()
    needs: [lint, lint-windows, lint-macos, msrv, test, test-windows, test-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every gate
        shell: bash
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          LINT_WINDOWS_RESULT: ${{ needs.lint-windows.result }}
          LINT_MACOS_RESULT: ${{ needs.lint-macos.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
          TEST_RESULT: ${{ needs.test.result }}
          TEST_WINDOWS_RESULT: ${{ needs.test-windows.result }}
          TEST_COVERAGE_RESULT: ${{ needs.test-coverage.result }}
        run: |
          failed=0
          for gate in LINT LINT_WINDOWS LINT_MACOS MSRV TEST TEST_WINDOWS TEST_COVERAGE; do
            result_var="${gate}_RESULT"
            result="${!result_var}"
            if [[ "$result" != "success" ]]; then
              echo "$gate did not succeed: $result" >&2
              failed=1
            fi
          done
          exit "$failed"
