name: CI

on:
  # `master` is the only base. The parallel-execution design's integration
  # branch, `codex/parallelism-design`, was deleted once its slices had landed;
  # standing another one up means adding its name to every branch list here and
  # in pr-policy.yml, and to the gate that pins them, in one change
  # (MAINTAINING.md, Repository rules).
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, edited, synchronize, reopened]
  # The merge queue builds each entry on the head of its base plus the entries
  # queued ahead of it, and lands exactly the commit these contexts passed on;
  # a branch is never brought up to date by hand to merge (MAINTAINING.md,
  # Repository rules). The concurrency key below is `github.ref` for this
  # event, one queue branch per entry, so entries never cancel each other.
  merge_group:
    types: [checks_requested]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # 30 minutes a leg, on every lane. While the macOS suite ran whole its
  # leg had 45 and ubuntu's had 30. In two merge-queue entries of one head
  # on 2026-10-29, runs 40834103792 and 40838006947, `test (macos-latest)`
  # exceeded the 30 minutes it then had and was cancelled. The second job
  # log contains every closing test summary, each ok; printed summaries
  # are not a successful exit. The 45 minutes named no cause for either
  # cancellation and repaired no test. Under them `test (macos-latest)`
  # was the slowest job of every run that did not wait for the guest:
  # 32m 23s of run 43705001427's 32m 32s on 2026-11-15, the harness
  # 1,777 s for 3,888 tests on three processors, 72% of that limit. So the
  # macOS suite was divided, at first into three shards:
  # `engine::topology::`, the rest of `engine::`, and everything else. The
  # same three ran on macOS in draft pull request #339 on 2026-10-18, run
  # 39146387106: 10m 13s, 12m 10s and 12m 17s a leg. The whole leg has
  # taken 27 to 37 minutes since, and no shard was timed at the suite the
  # shards landed on: the CI run of the pull request that landed them is
  # that measurement.
  #
  # A platform's slowest leg sets the run's wall clock. In run 44614925593
  # on 2026-11-19 the three macOS legs took 22.2, 11.3 and 14.3 minutes,
  # and 16.6, 11.8 and 14.5 in run 44516609416, about 4 of them fixed. The
  # one Linux leg took 11.4 minutes, and 13.4 in the other run, about 1.6
  # of them fixed. So that day both suites were divided by measured time,
  # macOS into five shards and Linux into two:
  # per-test weights from a sequential Linux run, scaled to each platform's
  # measured wall time for each shard and blended with a uniform per-test
  # model. The macOS
  # five of 2026-11-19 were `engine::topology::coordinator::`, the rest of
  # `engine::topology::`, the rest of `engine::`, `runner::`, and
  # everything else. Their slowest leg was predicted at about 14 to 15
  # minutes, and the slower Linux leg at about 8 to 9. Run 44667503206
  # measured both splits for the first time. The five macOS legs took
  # 15.8, 4.7, 8.2, 8.1 and 8.1 minutes, their libtest harnesses 721, 126,
  # 310, 255 and 312 s, about 3.9 minutes of each leg fixed. The two Linux
  # legs took 7.8 and 8.2 minutes, and that split stood until 2026-11-25.
  #
  # The macOS suite was divided again on 2026-11-20, from that run: each
  # test's sequential Linux duration scaled so that the leg it ran in sums
  # to that leg's measured harness, blended half and half with a uniform
  # per-test model, and the filters chosen by a search for the slowest
  # leg. The first leg, the 15.8 minutes, then ran only the coordinator's
  # tests whose names begin with `a_`, and the rest of the coordinator's
  # ran with the rest of `engine::topology::`. The slowest macOS leg was
  # predicted at about 11.8 minutes.
  #
  # The macOS suite was divided again on 2026-11-22, into five legs still,
  # each with a list of filters, and re-packed from three timed runs. The
  # weights were the mean of each test's measured Windows times over CI runs
  # 45045067738, 45161322179 and 45233912312, scaled by a ratio of macOS to
  # Windows time fitted for each group of tests on the macOS legs measured
  # with the lists before 2026-11-22 and with the first packed lists. Tests
  # are packed into legs whole module by whole module, and a module is
  # split by name prefix only where it alone exceeds a leg's budget.
  #
  # The filters were then rebalanced from each test's median time over CI
  # runs 45259861458, 45265008874, 45269007219, 45273775506 and
  # 45337940696, moving whole filters between legs so that each leg's
  # median job time would be about ten minutes or less, the target until
  # 2026-11-25; it is now about seven minutes a leg, below. The rebalance
  # was not timed before it landed: the CI run of the pull request that
  # landed it was its first measurement.
  #
  # On 2026-11-25, with the organisation's limits raised to 500 jobs and 50
  # macOS jobs, each suite was divided again so that every leg takes about
  # seven minutes. From the five complete runs 45503042270, 45505425187,
  # 45506422808, 45508617577 and 45513139892, a job's fixed part is setup,
  # compile, the two record captures and teardown: a median of 249 s on
  # macOS, 115 s on Linux and 210 s on Windows. A run spends 2121, 722 and
  # 4760 s running tests on the three, and a leg takes about the fixed part
  # plus its share. The legs were set at Linux 5, macOS 12 and Windows 22;
  # one more leg would save 24, 14 and 9 s. Each leg is predicted at
  # 257-268 s on Linux, 418-426 on macOS and 421-428 on Windows. A Windows
  # leg cannot finish before its slowest test:
  # `engine::topology::recover::tests::kill_after_report_before_each_cleanup_step_after_the_effect`
  # takes about 189 s, so that leg's floor is about 399 s. macOS gets 12
  # legs because with the native `msrv` entry a run asks for 13 macOS jobs,
  # so three runs at once stay within the 50 macOS jobs. The re-pack was not
  # timed before it landed: the CI run of the pull request that lands it is
  # its first measurement. 30 is about four times the slowest leg expected,
  # and the limit the Linux leg already had.
  test-linux:
    name: test (${{ matrix.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Windows is the first-class target (DESIGN.md §1) and its suite is not
        # an afterthought: the subprocess supervisor, the cmd /C quoting and the
        # PATHEXT resolution all behave differently per platform and are covered
        # by tests. It is absent from `test-linux` and `test-macos` because it
        # runs below, in `test-windows-hosted`, in twenty-two shards of its own.
        #
        # Seventeen legs in two jobs: the Linux suite as five shards here, the
        # first four each named by a list of filters and the fifth by
        # everything else, and the macOS suite as twelve in `test-macos`, the
        # first eleven each named by a list of filters and the twelfth by
        # everything else. The
        # shard rule is the one `test-windows-hosted` states below, applied to
        # each runner's legs on their own: a leg runs the tests whose names
        # contain any of its filters and none of the filters of the legs
        # before it, each of those a `--skip`; the last leg has no filter and
        # runs the tests that contain none of them. So every test runs in
        # exactly one Linux leg and in exactly one macOS leg. These legs carry
        # no floor on the count of passing tests and the shards add none: a
        # filter that matches no test only moves tests to a later leg of its
        # runner, and none stops running. The workflow oracle derives each
        # job's list from that job's row of its table of test jobs, the
        # runner and its filters, and holds the job's matrix to it entry for
        # entry, in order. Every `leg:` and
        # `tests:` value is double-quoted, as in that job's table.
        include:
          - leg: "ubuntu-latest, 1 of 5"
            tests: "effects::tests::every_pr6_refusal_st16_variant_and_invariant_clause_names_a_test_or_an_owner engine::topology::coordinator::tests::interleaving:: engine::topology::recover:: workspace_manager::tests::s workspace::"
          - leg: "ubuntu-latest, 2 of 5"
            tests: "engine::topology::coordinator::tests::a_g engine::topology::coordinator::tests::a_r workspace_manager::tests::t runner::contract:: topology::census:: --skip effects::tests::every_pr6_refusal_st16_variant_and_invariant_clause_names_a_test_or_an_owner --skip engine::topology::coordinator::tests::interleaving:: --skip engine::topology::recover:: --skip workspace_manager::tests::s --skip workspace::"
          - leg: "ubuntu-latest, 3 of 5"
            tests: "engine::topology::attempt:: workspace_manager::tests::r runner::container:: engine::tests:: --skip effects::tests::every_pr6_refusal_st16_variant_and_invariant_clause_names_a_test_or_an_owner --skip engine::topology::coordinator::tests::interleaving:: --skip engine::topology::recover:: --skip workspace_manager::tests::s --skip workspace:: --skip engine::topology::coordinator::tests::a_g --skip engine::topology::coordinator::tests::a_r --skip workspace_manager::tests::t --skip runner::contract:: --skip topology::census::"
          - leg: "ubuntu-latest, 4 of 5"
            tests: "engine::topology::coordinator::tests::a_p engine::topology::coordinator::tests::a_s workspace_manager::tests::a workspace_manager::tests::e workspace_manager::tests::n --skip effects::tests::every_pr6_refusal_st16_variant_and_invariant_clause_names_a_test_or_an_owner --skip engine::topology::coordinator::tests::interleaving:: --skip engine::topology::recover:: --skip workspace_manager::tests::s --skip workspace:: --skip engine::topology::coordinator::tests::a_g --skip engine::topology::coordinator::tests::a_r --skip workspace_manager::tests::t --skip runner::contract:: --skip topology::census:: --skip engine::topology::attempt:: --skip workspace_manager::tests::r --skip runner::container:: --skip engine::tests::"
          - leg: "ubuntu-latest, 5 of 5"
            tests: "--skip effects::tests::every_pr6_refusal_st16_variant_and_invariant_clause_names_a_test_or_an_owner --skip engine::topology::coordinator::tests::interleaving:: --skip engine::topology::recover:: --skip workspace_manager::tests::s --skip workspace:: --skip engine::topology::coordinator::tests::a_g --skip engine::topology::coordinator::tests::a_r --skip workspace_manager::tests::t --skip runner::contract:: --skip topology::census:: --skip engine::topology::attempt:: --skip workspace_manager::tests::r --skip runner::container:: --skip engine::tests:: --skip engine::topology::coordinator::tests::a_p --skip engine::topology::coordinator::tests::a_s --skip workspace_manager::tests::a --skip workspace_manager::tests::e --skip workspace_manager::tests::n"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          # `clippy` is a TEST dependency here, not only a lint one. PR5's
          # `expected_failures_refusals[6]` is "a disallowed primitive or
          # effectful wrapper outside an allowlisted module fails clippy", and
          # `effects::tests::every_declared_effect_denial_refuses_for_the_reason_
          # it_declares` discharges it by compiling one fixture per resolution
          # shape with `clippy-driver`. `dtolnay/rust-toolchain` installs the
          # minimal profile, so without this the fixtures could not run in the
          # job that runs the tests — which is `PR5-C-DOCTEST-FIXTURES-NEVER-RAN`
          # one step removed.
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The engine shells out to git and asserts on its output; runners have
      # git but no identity, and several tests commit.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@upstroke.local"
          git config --global user.name "upstroke CI"

      # `the_temporary_object_scan_resolves_case_aliases_as_the_filesystem_does`
      # requires its native casefold branch only where the leg declares that
      # the temporary directory its suite runs under folds case; anywhere
      # else -- the ubuntu legs, a developer's TMPDIR on case-sensitive APFS --
      # it observes the branch instead of failing it. The macOS runner's
      # temporary directory folds case and the ubuntu runner's does not, so
      # each platform's job declares its own, and `test-windows-hosted` makes
      # the same declaration for the hosted runner's NTFS. The workflow oracle
      # pins this one step-level `env:` as a whole map (the job's row of
      # `TEST_JOBS`), the way
      # it pins the aggregate's: any other key here is refused. The cargo
      # line hands libtest the leg's `matrix.tests`, on a Linux leg as on a
      # macOS one: the shard's filters, where it has any, and its skips.
      - run: cargo test --all-targets --all-features -- ${{ matrix.tests }}
        env:
          UPSTROKE_TEST_TEMP_FOLDS_CASE: ""

      # The native HOST acceptance record for this platform (Gate7 R21's host
      # row). `engine::tests::host_acceptance_record` is ignored by the suite
      # above and selected here by its exact name. It drives a fresh run and a
      # parked, answered and resumed run, both schema-4 runs on the production
      # HostRunner through the public entry points, and prints their raw
      # records as numbered hex lines between BEGIN and END
      # (`docs/internals/engine/tests.md`). `pipefail` carries Cargo's exit
      # through `tee`. The step then refuses unless exactly that test ran and
      # passed, and refuses a missing or incomplete frame. Printing is not
      # acceptance: the record is decoded from this log and every digest
      # checked. The step reuses the suite step's case-fold declaration, and
      # the workflow oracle pins its script and that map whole, immediately
      # after the suite.
      - name: Capture the native host acceptance record
        env:
          UPSTROKE_TEST_TEMP_FOLDS_CASE: ""
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/host-acceptance-record.log"
          cargo test --all-features --lib engine::tests::host_acceptance_record -- --ignored --exact --nocapture | tee "$log"
          if ! grep -qx 'test engine::tests::host_acceptance_record \.\.\. ok' "$log" || ! grep -q '^test result: ok\. 1 passed; 0 failed; 0 ignored; ' "$log"; then echo "the capture did not run exactly the one host acceptance test to a pass" >&2; exit 1; fi
          awk '
            $1 == "UPSTROKE-HOST-ACCEPTANCE-RECORD" { f[++m] = $0 }
            END {
              nb = split(f[1], b, " "); ne = split(f[m], e, " ")
              ok = m >= 3 && nb == 7 && ne == 7 && b[2] == "v1" && b[3] == "BEGIN" && e[2] == "v1" && e[3] == "END"
              ok = ok && b[4] " " b[5] " " b[6] " " b[7] == e[4] " " e[5] " " e[6] " " e[7] && b[5] "" == (m - 2) ""
              for (k = 2; ok && k < m; k++) ok = split(f[k], c, " ") == 5 && c[2] == "v1" && c[3] "" == b[4] "" && c[4] "" == (k - 1) "" && length(c[5]) == (k < m - 1 ? 192 : 2 * (b[6] - (b[5] - 1) * 96))
              exit !ok
            }' "$log" || { echo "the host acceptance record is missing or its framing is incomplete" >&2; exit 1; }

      # The container capability observation for this platform (Gate7 M2's
      # runtime question, contract version 2 under its root audit).
      # `runner::container::tests::container_capability_record` is ignored by
      # the suite and selected here by its exact name. It asks the CLI the
      # contract's bounded read-only questions -- the endpoint the CLI
      # resolved, the daemon's version, selected version fields and three
      # local image inspections, never a pull -- through the product's
      # process path, reduces every endpoint-sensitive answer in memory, and
      # prints the reduced record as numbered hex lines between BEGIN and END
      # (`docs/internals/runner/container/tests.md`). Every capability class
      # passes, an absent Docker included; an unresolved process, a binding
      # failure or a record its own decoder refuses fails the test.
      # `pipefail` carries Cargo's exit through `tee`; the step then refuses
      # unless exactly that test ran and passed, and refuses a missing or
      # incomplete frame. A class is an observation, not M2 acceptance, and
      # the Linux row is a control. Four minutes bound the 135 s the
      # questions may request, with Cargo's start. The step adds no
      # environment of its own; the workflow oracle pins it whole,
      # immediately after the host acceptance capture.
      - name: Capture the container capability observation
        timeout-minutes: 4
        env:
          UPSTROKE_TEST_TEMP_FOLDS_CASE: ""
        run: |
          set -eo pipefail
          log="$RUNNER_TEMP/container-capability-record.log"
          cargo test --all-features --lib runner::container::tests::container_capability_record -- --ignored --exact --nocapture | tee "$log"
          if ! grep -qx 'test runner::container::tests::container_capability_record \.\.\. ok' "$log" || ! grep -q '^test result: ok\. 1 passed; 0 failed; 0 ignored; ' "$log"; then echo "the observation did not run exactly the one container capability test to a pass" >&2; exit 1; fi
          awk '
            $1 == "UPSTROKE-CONTAINER-CAPABILITY-RECORD" { f[++m] = $0 }
            END {
              nb = split(f[1], b, " "); ne = split(f[m], e, " ")
              ok = m >= 3 && nb == 7 && ne == 7 && b[2] == "v1" && b[3] == "BEGIN" && e[2] == "v1" && e[3] == "END"
              ok = ok && b[4] " " b[5] " " b[6] " " b[7] == e[4] " " e[5] " " e[6] " " e[7] && b[5] "" == (m - 2) ""
              for (k = 2; ok && k < m; k++) ok = split(f[k], c, " ") == 5 && c[2] == "v1" && c[3] "" == b[4] "" && c[4] "" == (k - 1) "" && length(c[5]) == (k < m - 1 ? 192 : 2 * (b[6] - (b[5] - 1) * 96))
              exit !ok
            }' "$log" || { echo "the container capability record is missing or its framing is incomplete" >&2; exit 1; }

  # The macOS legs: the suite's shards on `macos-latest`, twelve of them, each
  # a leg of this job's matrix on a runner of its own. One job per platform
  # since 2026-11-24, on the owner's word: until then one `test` job ran the
  # Linux and macOS legs together, its runner read from each leg. The
  # timeout, its history and the division's are in the comment above
  # `test-linux`, and the shard rule is the one `test-linux`'s matrix
  # comment states, applied to this job's legs on their own.
  test-macos:
    name: test (${{ matrix.leg }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: "macos-latest, 1 of 12"
            tests: "engine::topology::coordinator::tests::interleaving::r engine::topology::coordinator::tests::a_pa engine::topology::coordinator::tests::r workspace_manager::tests::r workspace_manager::tests::t engine::tests::s"
          - leg: "macos-latest, 2 of 12"
            tests: "engine::topology::coordinator::tests::interleaving::e engine::topology::coordinator::tests::a_r engine::topology::integrate:: workspace_manager::tests::s engine::tests::a_s engine::tests::f --skip engine::topology::coordinator::tests::interleaving::r --skip engine::topology::coordinator::tests::a_pa --skip engine::topology::coordinator::tests::r --skip workspace_manager::tests::r --skip workspace_manager::tests::t --skip engine::tests::s"
          - leg: "macos-latest, 3 of 12"
            tests: "effects::tests::every_pr6_refusal_st16_variant_and_invariant_clause_names_a_test_or_an_owner engine::topology::coordinator::tests::a_s engine::topology::coordinator::tests::ap engine::topology::candidate:: engine::topology::coverage:: engine::tests::a_k --skip engine::topology::coordinator::tests::interleaving::r --skip engine::topology::coordinator::tests::a_pa --skip engine::topology::coordinator::tests::r --skip workspace_manager::tests::r --skip workspace_manager::tests::t --skip engine::tests::s --skip engine::topology::coordinator::tests::interleaving::e --skip engine::topology::coordinator::tests::a_r --skip engine::topology::integrate:: --skip workspace_manager::tests::s --skip engine::tests::a_s --skip engine::tests::f"
          - leg: "macos-latest, 4 of 12"
            tests: "effects::tests::every_test_the_container_fault_row_names_is_a_test_in_this_tree engine::topology::coordinator::tests::a_pipeline_is_served_while_a_ engine::topology::coordinator::tests::a_c engine::topology::coordinator::tests::c engine::topology::coordinator::tests::t workspace:: --skip engine::topology::coordinator::tests::interleaving::r --skip engine::topology::coordinator::tests::a_pa --skip engine::topology::coordinator::tests::r --skip workspace_manager::tests::r --skip workspace_manager::tests::t --skip engine::tests::s --skip engine::topology::coordinator::tests::interleaving::e --skip engine::topology::coordinator::tests::a_r --skip engine::topology::integrate:: --skip workspace_manager::tests::s --skip engine::tests::a_s --skip engine::tests::f --skip effects::tests::every_pr6_refusal_st16_variant_and_invariant_clause_names_a_test_or_an_owner --skip engine::topology::coordinator::tests::a_s --skip engine::topology::coordinator::tests::ap --skip engine::topology::candidate:: --skip engine::topology::coverage:: --skip engine::tests::a_k"
          - leg: "macos-latest, 5 of 12"
            tests: "engine::topology::coordinator::tests::a_k engine::topology::coordinator::tests::a_v engine::topology::coordinator::tests::o engine::topology::recover::tests::a_ engine::tests::l --skip engine::topology::coordinator::tests::interleaving::r --skip engine::topology::coordinator::tests::a_pa --skip engine::topology::coordinator::tests::r --skip workspace_manager::tests::r --skip workspace_manager::tests::t --skip engine::tests::s --skip engine::topology::coordinator::tests::interleaving::e --skip engine::topology::coordinator::tests::a_r --skip engine::topology::integrate:: --skip workspace_manager::tests::s --skip engine::tests::a_s --skip engine::tests::f --skip effects::tests::every_pr6_refusal_st16_variant_and_invariant_clause_names_a_test_or_an_owner --skip engine::topology::coordinator::tests::a_s --skip engine::topology::coordinator::tests::ap --skip engine::topology::candidate:: --skip engine::topology::coverage:: --skip engine::tests::a_k --skip effects::tests::every_test_the_container_fault_row_names_is_a_test_in_this_tree --skip engine::topology::coordinator::tests::a_pipeline_is_served_while_a_ --skip engine::topology::coordinator::tests::a_c --skip engine::topology::coordinator::tests::c --skip engine::topology::coordinator::tests::t --skip workspace::"
          - leg: "macos-latest, 6 of 12"
            tests: "engine::topology::coordinator::tests::a_d engine::topology::coordinator::tests::a_h workspace_manager::tests::e engine::topology::ledger:: topology::census:: engine::tests::r --skip engine::topology::coordinator::tests::interleaving::r --skip engine::topology::coordinator::tests::a_pa --skip engine::topology::coordinator::tests::r --skip workspace_manager::tests::r --skip workspace_manager::tests::t --skip engine::tests::s --skip engine::topology::coordinator::tests::interleaving::e --skip engine::topology::coordinator::tests::a_r --skip engine::topology::integrate:: --skip workspace_manager::tests::s --skip engine::tests::a_s --skip engine::tests::f --skip effects::tests::every_pr6_refusal_st16_variant_and_invariant_clause_names_a_test_or_an_owner --skip engine::topology::coordinator::tests::a_s --skip engine::topology::coordinator::tests::ap --skip engine::topology::candidate:: --skip engine::topology::coverage:: --skip engine::tests::a_k --skip effects::tests::every_test_the_container_fault_row_names_is_a_test_in_this_tree --skip engine::topology::coordinator::tests::a_pipeline_is_served_while_a_ --skip engine::topology::coordinator::tests::a_c --skip engine::topology::coordinator::tests::c --skip engine::topology::coordinator::tests::t --skip workspace:: --skip engine::topology::coordinator::tests::a_k --skip engine::topology::coordinator::tests::a_v --skip engine::topology::coordinator::tests::o --skip engine::topology::recover::tests::a_ --skip engine::tests::l"
          - leg: "macos-latest, 7 of 12"
