name: CI

on:
  # `master` is the only base. The parallel-execution design's integration
  # branch, `codex/parallelism-design`, was deleted once its slices had landed;
  # standing another one up means adding its name to every branch list here and
  # in pr-policy.yml, and to the gate that pins them, in one change
  # (MAINTAINING.md, Repository rules).
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, edited, synchronize, reopened]
  # The merge queue builds each entry on the head of its base plus the entries
  # queued ahead of it, and lands exactly the commit these contexts passed on;
  # a branch is never brought up to date by hand to merge (MAINTAINING.md,
  # Repository rules). The concurrency key below is `github.ref` for this
  # event, one queue branch per entry, so entries never cancel each other.
  merge_group:
    types: [checks_requested]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Category membership is defined in src/effects/tests/ci_model.rs.
  # Regenerate with python3 .github/scripts/test-categories.py generate.
  # There are 7 Linux, 9 macOS and 20 Windows test legs; none is a catch-all.
  # Native category listing precedes the suites (on macOS, on the generated owner).
  # 30 minutes a leg, on every lane. While the macOS suite ran whole its
  # leg had 45 and ubuntu's had 30. In two merge-queue entries of one head
  # on 2026-10-29, runs 40834103792 and 40838006947, `test (macos-latest)`
  # exceeded the 30 minutes it then had and was cancelled. The second job
  # log contains every closing test summary, each ok; printed summaries
  # are not a successful exit. The 45 minutes named no cause for either
  # cancellation and repaired no test. Under them `test (macos-latest)`
  # was the slowest job of every run that did not wait for the guest:
  # 32m 23s of run 43705001427's 32m 32s on 2026-11-15, the harness
  # 1,777 s for 3,888 tests on three processors, 72% of that limit. So the
  # macOS suite was divided, at first into three shards:
  # `engine::topology::`, the rest of `engine::`, and everything else. The
  # same three ran on macOS in draft pull request #339 on 2026-10-18, run
  # 39146387106: 10m 13s, 12m 10s and 12m 17s a leg. The whole leg has
  # taken 27 to 37 minutes since, and no shard was timed at the suite the
  # shards landed on: the CI run of the pull request that landed them is
  # that measurement.
  #
  # A platform's slowest leg sets the run's wall clock. In run 44614925593
  # on 2026-11-19 the three macOS legs took 22.2, 11.3 and 14.3 minutes,
  # and 16.6, 11.8 and 14.5 in run 44516609416, about 4 of them fixed. The
  # one Linux leg took 11.4 minutes, and 13.4 in the other run, about 1.6
  # of them fixed. So that day both suites were divided by measured time,
  # macOS into five shards and Linux into two:
  # per-test weights from a sequential Linux run, scaled to each platform's
  # measured wall time for each shard and blended with a uniform per-test
  # model. The macOS
  # five of 2026-11-19 were `engine::topology::coordinator::`, the rest of
  # `engine::topology::`, the rest of `engine::`, `runner::`, and
  # everything else. Their slowest leg was predicted at about 14 to 15
  # minutes, and the slower Linux leg at about 8 to 9. Run 44667503206
  # measured both splits for the first time. The five macOS legs took
  # 15.8, 4.7, 8.2, 8.1 and 8.1 minutes, their libtest harnesses 721, 126,
  # 310, 255 and 312 s, about 3.9 minutes of each leg fixed. The two Linux
  # legs took 7.8 and 8.2 minutes, and that split stood until 2026-11-25.
  #
  # The macOS suite was divided again on 2026-11-20, from that run: each
  # test's sequential Linux duration scaled so that the leg it ran in sums
  # to that leg's measured harness, blended half and half with a uniform
  # per-test model, and the filters chosen by a search for the slowest
  # leg. The first leg, the 15.8 minutes, then ran only the coordinator's
  # tests whose names begin with `a_`, and the rest of the coordinator's
  # ran with the rest of `engine::topology::`. The slowest macOS leg was
  # predicted at about 11.8 minutes.
  #
  # The macOS suite was divided again on 2026-11-22, into five legs still,
  # each with a list of filters, and re-packed from three timed runs. The
  # weights were the mean of each test's measured Windows times over CI runs
  # 45045067738, 45161322179 and 45233912312, scaled by a ratio of macOS to
  # Windows time fitted for each group of tests on the macOS legs measured
  # with the lists before 2026-11-22 and with the first packed lists. Tests
  # are packed into legs whole module by whole module, and a module is
  # split by name prefix only where it alone exceeds a leg's budget.
  #
  # The filters were then rebalanced from each test's median time over CI
  # runs 45259861458, 45265008874, 45269007219, 45273775506 and
  # 45337940696, moving whole filters between legs so that each leg's
  # median job time would be about ten minutes or less, the target until
  # 2026-11-25; it is now about seven minutes a leg, below. The rebalance
  # was not timed before it landed: the CI run of the pull request that
  # landed it was its first measurement.
  #
  # On 2026-11-25, with the organisation's limits raised to 500 jobs and 50
  # macOS jobs, each suite was divided again so that every leg takes about
  # seven minutes. From the five complete runs 45503042270, 45505425187,
  # 45506422808, 45508617577 and 45513139892, a job's fixed part is setup,
  # compile, the two record captures and teardown: a median of 249 s on
  # macOS, 115 s on Linux and 210 s on Windows. A run spends 2121, 722 and
  # 4760 s running tests on the three, and a leg takes about the fixed part
  # plus its share. The legs were set at Linux 5, macOS 12 and Windows 22;
  # one more leg would save 24, 14 and 9 s. Each leg is predicted at
  # 257-268 s on Linux, 418-426 on macOS and 421-428 on Windows. A Windows
  # leg cannot finish before its slowest test:
  # `engine::topology::recover::tests::kill_after_report_before_each_cleanup_step_after_the_effect`
  # takes about 189 s, so that leg's floor is about 399 s. macOS gets 12
  # legs because with the native `msrv` entry a run asks for 13 macOS jobs,
  # so three runs at once stay within the 50 macOS jobs. The re-pack was not
  # timed before it landed: the CI run of the pull request that lands it is
  # its first measurement. 30 is about four times the slowest leg expected,
  # and the limit the Linux leg already had.
  test-linux:
    name: test (${{ matrix.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # BEGIN TEST_CATEGORIES ubuntu
        include:
          - leg: "ubuntu-latest, coordinator (core, interleaving, pipelines, registry_waits, runners, scheduling, shutdown, snapshot_registration, verification_charges)"
            tests: "engine::topology::coordinator:: --skip _child_kills_ --skip kill_at_every_cell --skip kill_after_report_before_each_cleanup_step --skip _stopped_at_any_phase_"
          - leg: "ubuntu-latest, engine (attempt, capacity_budget, end-to-end, kept_output, legacy_resume, questions, recover, report, snapshot_registration, topology, topology_admission, topology_execution, verification)"
            tests: "engine::topology::recover:: engine::tests:: engine::topology::attempt:: engine::topology::run:: engine::topology::integrate:: engine::topology::dispatch:: engine::topology::coverage:: engine::topology::ledger:: engine::topology::candidate:: engine::topology::finalize:: engine::topology::create:: engine::topology::startup:: engine::topology::repair:: engine::topology::permits:: engine::topology::emit:: engine::topology::settle:: engine::topology::entry:: engine::topology::identity:: engine::topology::preflight:: engine::topology::prelock:: engine::topology::profiled:: engine::topology::seams:: engine::topology::select:: engine::report:: --skip _child_kills_ --skip kill_at_every_cell --skip kill_after_report_before_each_cleanup_step --skip _stopped_at_any_phase_ --skip engine::topology::coordinator::tests::interleaving:: --skip engine::topology::coordinator::tests::pipelines:: --skip engine::topology::coordinator::tests::registry_waits:: --skip engine::topology::coordinator::tests::runners:: --skip engine::topology::coordinator::tests::scheduling:: --skip engine::topology::coordinator::tests::shutdown:: --skip engine::topology::coordinator::tests::snapshot_registration:: --skip engine::topology::coordinator::tests::verification_charges:: --skip engine::topology::coordinator::"
          - leg: "ubuntu-latest, kill-path (matrices, samplers)"
            tests: "_child_kills_ kill_at_every_cell kill_after_report_before_each_cleanup_step _stopped_at_any_phase_"
          - leg: "ubuntu-latest, runner (container, contract, host, policy)"
            tests: "runner::container:: runner::contract:: runner::host:: runner::invocation:: runner::policy:: --skip _child_kills_ --skip kill_at_every_cell --skip kill_after_report_before_each_cleanup_step --skip _stopped_at_any_phase_ --skip engine::topology::coordinator::tests::interleaving:: --skip engine::topology::coordinator::tests::pipelines:: --skip engine::topology::coordinator::tests::registry_waits:: --skip engine::topology::coordinator::tests::runners:: --skip engine::topology::coordinator::tests::scheduling:: --skip engine::topology::coordinator::tests::shutdown:: --skip engine::topology::coordinator::tests::snapshot_registration:: --skip engine::topology::coordinator::tests::verification_charges:: --skip engine::topology::coordinator:: --skip engine::topology::recover:: --skip engine::tests::capacity_budget:: --skip engine::tests::kept_output:: --skip engine::tests::legacy_resume:: --skip engine::tests::questions:: --skip engine::tests::snapshot_registration:: --skip engine::tests::topology_admission:: --skip engine::tests::topology_execution:: --skip engine::tests::verification:: --skip engine::tests:: --skip engine::topology::attempt:: --skip engine::topology::run:: --skip engine::topology::integrate:: --skip engine::topology::dispatch:: --skip engine::topology::coverage:: --skip engine::topology::ledger:: --skip engine::topology::candidate:: --skip engine::topology::finalize:: --skip engine::topology::create:: --skip engine::topology::startup:: --skip engine::topology::repair:: --skip engine::topology::permits:: --skip engine::topology::emit:: --skip engine::topology::settle:: --skip engine::topology::entry:: --skip engine::topology::identity:: --skip engine::topology::preflight:: --skip engine::topology::prelock:: --skip engine::topology::profiled:: --skip engine::topology::seams:: --skip engine::topology::select:: --skip engine::report:: --skip workspace_manager::tests::containment:: --skip workspace_manager::tests::guarded_reads:: --skip workspace_manager::tests::incarnations:: --skip workspace_manager::tests::reclaim:: --skip workspace_manager::tests::refs:: --skip workspace_manager::tests::registry:: --skip workspace_manager::tests::residue:: --skip workspace_manager::tests::snapshots:: --skip workspace_manager:: --skip workspace::tests::"
          - leg: "ubuntu-latest, self-checks (census, effects)"
            tests: "effects::tests:: topology::census:: --skip _child_kills_ --skip kill_at_every_cell --skip kill_after_report_before_each_cleanup_step --skip _stopped_at_any_phase_ --skip engine::topology::coordinator::tests::interleaving:: --skip engine::topology::coordinator::tests::pipelines:: --skip engine::topology::coordinator::tests::registry_waits:: --skip engine::topology::coordinator::tests::runners:: --skip engine::topology::coordinator::tests::scheduling:: --skip engine::topology::coordinator::tests::shutdown:: --skip engine::topology::coordinator::tests::snapshot_registration:: --skip engine::topology::coordinator::tests::verification_charges:: --skip engine::topology::coordinator:: --skip engine::topology::recover:: --skip engine::tests::capacity_budget:: --skip engine::tests::kept_output:: --skip engine::tests::legacy_resume:: --skip engine::tests::questions:: --skip engine::tests::snapshot_registration:: --skip engine::tests::topology_admission:: --skip engine::tests::topology_execution:: --skip engine::tests::verification:: --skip engine::tests:: --skip engine::topology::attempt:: --skip engine::topology::run:: --skip engine::topology::integrate:: --skip engine::topology::dispatch:: --skip engine::topology::coverage:: --skip engine::topology::ledger:: --skip engine::topology::candidate:: --skip engine::topology::finalize:: --skip engine::topology::create:: --skip engine::topology::startup:: --skip engine::topology::repair:: --skip engine::topology::permits:: --skip engine::topology::emit:: --skip engine::topology::settle:: --skip engine::topology::entry:: --skip engine::topology::identity:: --skip engine::topology::preflight:: --skip engine::topology::prelock:: --skip engine::topology::profiled:: --skip engine::topology::seams:: --skip engine::topology::select:: --skip engine::report:: --skip workspace_manager::tests::containment:: --skip workspace_manager::tests::guarded_reads:: --skip workspace_manager::tests::incarnations:: --skip workspace_manager::tests::reclaim:: --skip workspace_manager::tests::refs:: --skip workspace_manager::tests::registry:: --skip workspace_manager::tests::residue:: --skip workspace_manager::tests::snapshots:: --skip workspace_manager:: --skip workspace::tests:: --skip runner::container:: --skip runner::contract:: --skip runner::host:: --skip runner::invocation:: --skip runner::policy:: --skip topology::fold:: --skip topology::effects:: --skip topology::events:: --skip topology::registry:: --skip topology::schema:: --skip topology::paths::"
          - leg: "ubuntu-latest, unit (agent-adapters, agent-proc, cli, config, model, plan, run-state, util)"
            tests: "topology::fold:: topology::effects:: topology::registry:: topology::schema:: topology::paths:: agent::proc:: agent::adapter:: agent::bin:: agent::claude:: agent::codex:: agent::copilot:: config:: capacity:: tracker:: connect:: plan:: validate:: ir::tests:: ladder:: catalog:: route:: rundir:: events:: review:: gates:: interaction:: answer:: status:: export:: util:: ulid:: error:: cli_tests:: --skip _child_kills_ --skip kill_at_every_cell --skip kill_after_report_before_each_cleanup_step --skip _stopped_at_any_phase_ --skip engine::topology::coordinator::tests::interleaving:: --skip engine::topology::coordinator::tests::pipelines:: --skip engine::topology::coordinator::tests::registry_waits:: --skip engine::topology::coordinator::tests::runners:: --skip engine::topology::coordinator::tests::scheduling:: --skip engine::topology::coordinator::tests::shutdown:: --skip engine::topology::coordinator::tests::snapshot_registration:: --skip engine::topology::coordinator::tests::verification_charges:: --skip engine::topology::coordinator:: --skip engine::topology::recover:: --skip engine::tests::capacity_budget:: --skip engine::tests::kept_output:: --skip engine::tests::legacy_resume:: --skip engine::tests::questions:: --skip engine::tests::snapshot_registration:: --skip engine::tests::topology_admission:: --skip engine::tests::topology_execution:: --skip engine::tests::verification:: --skip engine::tests:: --skip engine::topology::attempt:: --skip engine::topology::run:: --skip engine::topology::integrate:: --skip engine::topology::dispatch:: --skip engine::topology::coverage:: --skip engine::topology::ledger:: --skip engine::topology::candidate:: --skip engine::topology::finalize:: --skip engine::topology::create:: --skip engine::topology::startup:: --skip engine::topology::repair:: --skip engine::topology::permits:: --skip engine::topology::emit:: --skip engine::topology::settle:: --skip engine::topology::entry:: --skip engine::topology::identity:: --skip engine::topology::preflight:: --skip engine::topology::prelock:: --skip engine::topology::profiled:: --skip engine::topology::seams:: --skip engine::topology::select:: --skip engine::report:: --skip workspace_manager::tests::containment:: --skip workspace_manager::tests::guarded_reads:: --skip workspace_manager::tests::incarnations:: --skip workspace_manager::tests::reclaim:: --skip workspace_manager::tests::refs:: --skip workspace_manager::tests::registry:: --skip workspace_manager::tests::residue:: --skip workspace_manager::tests::snapshots:: --skip workspace_manager:: --skip workspace::tests:: --skip runner::container:: --skip runner::contract:: --skip runner::host:: --skip runner::invocation:: --skip runner::policy::"
          - leg: "ubuntu-latest, workspace (checkout, containment, guarded_reads, incarnations, manager, reclaim, refs, registry, residue, snapshots)"
            tests: "workspace_manager:: workspace::tests:: --skip _child_kills_ --skip kill_at_every_cell --skip kill_after_report_before_each_cleanup_step --skip _stopped_at_any_phase_ --skip engine::topology::coordinator::tests::interleaving:: --skip engine::topology::coordinator::tests::pipelines:: --skip engine::topology::coordinator::tests::registry_waits:: --skip engine::topology::coordinator::tests::runners:: --skip engine::topology::coordinator::tests::scheduling:: --skip engine::topology::coordinator::tests::shutdown:: --skip engine::topology::coordinator::tests::snapshot_registration:: --skip engine::topology::coordinator::tests::verification_charges:: --skip engine::topology::coordinator:: --skip engine::topology::recover:: --skip engine::tests::capacity_budget:: --skip engine::tests::kept_output:: --skip engine::tests::legacy_resume:: --skip engine::tests::questions:: --skip engine::tests::snapshot_registration:: --skip engine::tests::topology_admission:: --skip engine::tests::topology_execution:: --skip engine::tests::verification:: --skip engine::tests:: --skip engine::topology::attempt:: --skip engine::topology::run:: --skip engine::topology::integrate:: --skip engine::topology::dispatch:: --skip engine::topology::coverage:: --skip engine::topology::ledger:: --skip engine::topology::candidate:: --skip engine::topology::finalize:: --skip engine::topology::create:: --skip engine::topology::startup:: --skip engine::topology::repair:: --skip engine::topology::permits:: --skip engine::topology::emit:: --skip engine::topology::settle:: --skip engine::topology::entry:: --skip engine::topology::identity:: --skip engine::topology::preflight:: --skip engine::topology::prelock:: --skip engine::topology::profiled:: --skip engine::topology::seams:: --skip engine::topology::select:: --skip engine::report::"
        # END TEST_CATEGORIES ubuntu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          # `clippy` is a TEST dependency here, not only a lint one. PR5's
          # `expected_failures_refusals[6]` is "a disallowed primitive or
          # effectful wrapper outside an allowlisted module fails clippy", and
          # `effects::tests::every_declared_effect_denial_refuses_for_the_reason_
          # it_declares` discharges it by compiling one fixture per resolution
          # shape with `clippy-driver`. `dtolnay/rust-toolchain` installs the
          # minimal profile, so without this the fixtures could not run in the
          # job that runs the tests — which is `PR5-C-DOCTEST-FIXTURES-NEVER-RAN`
          # one step removed.
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The engine shells out to git and asserts on its output; runners have
      # git but no identity, and several tests commit.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@upstroke.local"
          git config --global user.name "upstroke CI"

      # `the_temporary_object_scan_resolves_case_aliases_as_the_filesystem_does`
      # requires its native casefold branch only where the leg declares that
      # the temporary directory its suite runs under folds case; anywhere
      # else -- the ubuntu legs, a developer's TMPDIR on case-sensitive APFS --
      # it observes the branch instead of failing it. The macOS runner's
      # temporary directory folds case and the ubuntu runner's does not, so
      # each platform's job declares its own, and `test-windows-hosted` makes
      # the same declaration for the hosted runner's NTFS. The workflow oracle
      # pins this one step-level `env:` as a whole map (the job's row of
      # `TEST_JOBS`), the way
      # it pins the aggregate's: any other key here is refused. The cargo
      # line hands libtest the leg's `matrix.tests`, on a Linux leg as on a
      # macOS one: the shard's filters, where it has any, and its skips.
      - name: Uncategorised (must list zero tests)
        run: bash .github/scripts/test-categories.sh

      - run: cargo test --all-targets --all-features -- ${{ matrix.tests }}
        env:
          UPSTROKE_TEST_TEMP_FOLDS_CASE: ""

      # The native HOST acceptance record for this platform (Gate7 R21's host
      # row). `engine::tests::host_acceptance_record` is ignored by the suite
      # above and selected here by its exact name. It drives a fresh run and a
      # parked, answered and resumed run, both schema-4 runs on the production
      # HostRunner through the public entry points, and prints their raw
      # records as numbered hex lines between BEGIN and END
      # (`docs/internals/engine/tests.md`). `pipefail` carries Cargo's exit
      # through `tee`. The step then refuses unless exactly that test ran and
      # passed, and refuses a missing or incomplete frame. Printing is not
      # acceptance: the record is decoded from this log and every digest
      # checked. The step reuses the suite step's case-fold declaration, and
      # the workflow oracle pins its script and that map whole, immediately
      # after the suite.
      - name: Capture the native host acceptance record
        env:
          UPSTROKE_TEST_TEMP_FOLDS_CASE: ""
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/host-acceptance-record.log"
          cargo test --all-features --lib engine::tests::host_acceptance_record -- --ignored --exact --nocapture | tee "$log"
          if ! grep -qx 'test engine::tests::host_acceptance_record \.\.\. ok' "$log" || ! grep -q '^test result: ok\. 1 passed; 0 failed; 0 ignored; ' "$log"; then echo "the capture did not run exactly the one host acceptance test to a pass" >&2; exit 1; fi
          awk '
            $1 == "UPSTROKE-HOST-ACCEPTANCE-RECORD" { f[++m] = $0 }
            END {
              nb = split(f[1], b, " "); ne = split(f[m], e, " ")
              ok = m >= 3 && nb == 7 && ne == 7 && b[2] == "v1" && b[3] == "BEGIN" && e[2] == "v1" && e[3] == "END"
              ok = ok && b[4] " " b[5] " " b[6] " " b[7] == e[4] " " e[5] " " e[6] " " e[7] && b[5] "" == (m - 2) ""
              for (k = 2; ok && k < m; k++) ok = split(f[k], c, " ") == 5 && c[2] == "v1" && c[3] "" == b[4] "" && c[4] "" == (k - 1) "" && length(c[5]) == (k < m - 1 ? 192 : 2 * (b[6] - (b[5] - 1) * 96))
              exit !ok
            }' "$log" || { echo "the host acceptance record is missing or its framing is incomplete" >&2; exit 1; }

      # The container capability observation for this platform (Gate7 M2's
      # runtime question, contract version 2 under its root audit).
      # `runner::container::tests::container_capability_record` is ignored by
      # the suite and selected here by its exact name. It asks the CLI the
      # contract's bounded read-only questions -- the endpoint the CLI
      # resolved, the daemon's version, selected version fields and three
      # local image inspections, never a pull -- through the product's
      # process path, reduces every endpoint-sensitive answer in memory, and
      # prints the reduced record as numbered hex lines between BEGIN and END
      # (`docs/internals/runner/container/tests.md`). Every capability class
      # passes, an absent Docker included; an unresolved process, a binding
      # failure or a record its own decoder refuses fails the test.
      # `pipefail` carries Cargo's exit through `tee`; the step then refuses
      # unless exactly that test ran and passed, and refuses a missing or
      # incomplete frame. A class is an observation, not M2 acceptance, and
      # the Linux row is a control. Four minutes bound the 135 s the
      # questions may request, with Cargo's start. The step adds no
      # environment of its own; the workflow oracle pins it whole,
      # immediately after the host acceptance capture.
      - name: Capture the container capability observation
        timeout-minutes: 4
        env:
          UPSTROKE_TEST_TEMP_FOLDS_CASE: ""
        run: |
          set -eo pipefail
          log="$RUNNER_TEMP/container-capability-record.log"
          cargo test --all-features --lib runner::container::tests::container_capability_record -- --ignored --exact --nocapture | tee "$log"
          if ! grep -qx 'test runner::container::tests::container_capability_record \.\.\. ok' "$log" || ! grep -q '^test result: ok\. 1 passed; 0 failed; 0 ignored; ' "$log"; then echo "the observation did not run exactly the one container capability test to a pass" >&2; exit 1; fi
          awk '
            $1 == "UPSTROKE-CONTAINER-CAPABILITY-RECORD" { f[++m] = $0 }
            END {
              nb = split(f[1], b, " "); ne = split(f[m], e, " ")
              ok = m >= 3 && nb == 7 && ne == 7 && b[2] == "v1" && b[3] == "BEGIN" && e[2] == "v1" && e[3] == "END"
              ok = ok && b[4] " " b[5] " " b[6] " " b[7] == e[4] " " e[5] " " e[6] " " e[7] && b[5] "" == (m - 2) ""
              for (k = 2; ok && k < m; k++) ok = split(f[k], c, " ") == 5 && c[2] == "v1" && c[3] "" == b[4] "" && c[4] "" == (k - 1) "" && length(c[5]) == (k < m - 1 ? 192 : 2 * (b[6] - (b[5] - 1) * 96))
              exit !ok
            }' "$log" || { echo "the container capability record is missing or its framing is incomplete" >&2; exit 1; }

  # Nine named macOS test legs plus the independent native MSRV job. The unit
  # leg lists the uncategorised remainder before its tests. All matrices come
  # from TEST_CATEGORIES, with no executing catch-all.
  test-macos:
    name: test (${{ matrix.leg }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # BEGIN TEST_CATEGORIES macos
        include:
          - leg: "macos-latest, coordinator 1 of 2 (core, pipelines, snapshot_registration, verification_charges)"
            tests: "engine::topology::coordinator:: --skip _child_kills_ --skip kill_at_every_cell --skip kill_after_report_before_each_cleanup_step --skip _stopped_at_any_phase_ --skip engine::topology::coordinator::tests::interleaving:: --skip engine::topology::coordinator::tests::registry_waits:: --skip engine::topology::coordinator::tests::runners:: --skip engine::topology::coordinator::tests::scheduling:: --skip engine::topology::coordinator::tests::shutdown::"
            check_inventory: false
          - leg: "macos-latest, coordinator 2 of 2 (interleaving, registry_waits, runners, scheduling, shutdown)"
