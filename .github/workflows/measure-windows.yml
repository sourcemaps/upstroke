# Measurement-only workflow. Runs the Windows suite N times in parallel on
# GitHub-hosted runners to sample the host lottery, so the hosted leg can be
# compared against the self-hosted `winguest` leg with more than one draw.
# Steps mirror ci.yml's `test` job exactly (same pinned actions, same order)
# so the numbers are comparable. Not part of any required check; delete the
# branch when the measurement is done.
name: measure-windows

on:
  push:
    branches: ['measure/**']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  sample:
    name: sample ${{ matrix.sample }} (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Configure git identity
        run: |
          git config --global user.email "ci@upstroke.local"
          git config --global user.name "upstroke CI"

      - run: cargo test --all-targets --all-features
