# Measurement only: never merged, never a pull request (`measure/` is outside
# the branch vocabulary). It samples the Windows suite on windows-latest to
# decide how the suite should run there. `whole` runs the hosted twin's steps
# from ci.yml as they stand, twice, to see the spread between machines; once
# with the temporary directory on the workspace drive; and once with
# Defender's real-time scanning turned off. `shard` runs the suite split four
# ways by test name. libtest runs a test whose name contains a filter and
# contains no `--skip` string; each shard skips every earlier shard's filter
# and the last has no filter, so every test runs in exactly one shard and the
# four printed counts add up to a whole run's count. ci.yml is untouched and
# no required check reads this file. Delete the branch when the numbers are
# recorded.
name: measure-windows

on:
  push:
    branches: ['measure/**']

permissions:
  contents: read

concurrency:
  group: measure-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  whole:
    name: whole (${{ matrix.name }})
    runs-on: windows-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        name: [control-1, control-2, temp-on-workspace-drive, defender-off]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install the image's toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: clippy

      - name: Configure git identity
        run: |
          git config --global user.email "ci@upstroke.local"
          git config --global user.name "upstroke CI"

      - name: Describe the machine
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          "processors: $env:NUMBER_OF_PROCESSORS"
          Get-CimInstance Win32_Processor | Format-List Name, NumberOfCores, NumberOfLogicalProcessors, MaxClockSpeed
          Get-CimInstance Win32_ComputerSystem | Format-List Model, TotalPhysicalMemory
          Get-Volume | Format-Table DriveLetter, FileSystemType, DriveType, Size, SizeRemaining
          Get-PhysicalDisk | Format-Table FriendlyName, MediaType, BusType, Size
          "TEMP: $env:TEMP"
          "RUNNER_TEMP: $env:RUNNER_TEMP"
          "GITHUB_WORKSPACE: $env:GITHUB_WORKSPACE"
          Get-MpComputerStatus | Format-List AMServiceEnabled, AntivirusEnabled, RealTimeProtectionEnabled, OnAccessProtectionEnabled, BehaviorMonitorEnabled, IoavProtectionEnabled, IsTamperProtected
          Get-MpPreference | Format-List DisableRealtimeMonitoring, ExclusionPath, ExclusionProcess
          git --version
          exit 0

      - name: Put the temporary directory on the workspace drive
        if: matrix.name == 'temp-on-workspace-drive'
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 't'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$dir"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$dir"

      - name: Turn Defender's real-time scanning off
        if: matrix.name == 'defender-off'
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          Set-MpPreference -DisableRealtimeMonitoring $true
          Add-MpPreference -ExclusionPath 'C:\', 'D:\'
          Get-MpComputerStatus | Format-List RealTimeProtectionEnabled, OnAccessProtectionEnabled, BehaviorMonitorEnabled, IoavProtectionEnabled, IsTamperProtected
          exit 0

      - name: Time process starts and file writes
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          "TEMP: $env:TEMP"
          $watch = [Diagnostics.Stopwatch]::StartNew()
          foreach ($i in 1..200) { git --version | Out-Null }
          "200 starts of git: $($watch.ElapsedMilliseconds) ms"
          foreach ($d in @($env:TEMP, $env:RUNNER_TEMP)) {
            $p = Join-Path $d 'measure-files'
            New-Item -ItemType Directory -Force -Path $p | Out-Null
            $watch = [Diagnostics.Stopwatch]::StartNew()
            foreach ($i in 1..2000) { [IO.File]::WriteAllText((Join-Path $p "f$i.txt"), 'x') }
            Remove-Item -Recurse -Force $p
            "2000 files written and removed under ${d}: $($watch.ElapsedMilliseconds) ms"
          }
          exit 0

      - name: Read the processor times before the suite
        continue-on-error: true
        run: |
          $times = Add-Type -PassThru -Namespace Measure -Name Times -MemberDefinition '[DllImport("kernel32.dll")] public static extern bool GetSystemTimes(out long idle, out long kernel, out long user);'
          $idle = 0L; $kernel = 0L; $user = 0L
          $null = $times::GetSystemTimes([ref]$idle, [ref]$kernel, [ref]$user)
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'processor-times-before.txt') -Value "$idle $kernel $user"

      - name: Test, and witness that the suite ran
        env:
          UPSTROKE_TEST_TEMP_FOLDS_CASE: "1"
        run: |
          $rustc = ((cargo rustc -q --lib -- --version) | Out-String).Trim(); $path_rustc = ((rustc --version) | Out-String).Trim(); $cargo = ((cargo --version) | Out-String).Trim()
          if ($rustc -notmatch '^rustc 1\.97\.1 ' -or $path_rustc -notmatch '^rustc 1\.97\.1 ' -or $cargo -notmatch '^cargo 1\.97\.1 ') { throw "the suite would run on '$rustc' (Cargo's compiler), '$path_rustc' (PATH's rustc) and '$cargo', not the image's 1.97.1: a compiler was chosen by something other than this workflow" }
          cargo test --all-targets --all-features | Tee-Object -Variable log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $passed = [int](($log | Select-String -Pattern '^test result: ok\. (\d+) passed' | ForEach-Object { [int]$_.Matches[0].Groups[1].Value } | Measure-Object -Sum).Sum)
          if ($passed -lt 1700) { throw "the suite reported $passed passing tests, below the floor of 1700: Cargo compiled the harnesses and executed almost none of them" }

      - name: Read the processor times after the suite
        if: always()
        continue-on-error: true
        run: |
          $times = Add-Type -PassThru -Namespace Measure -Name Times -MemberDefinition '[DllImport("kernel32.dll")] public static extern bool GetSystemTimes(out long idle, out long kernel, out long user);'
          $idle = 0L; $kernel = 0L; $user = 0L
          $null = $times::GetSystemTimes([ref]$idle, [ref]$kernel, [ref]$user)
          $before = (Get-Content (Join-Path $env:RUNNER_TEMP 'processor-times-before.txt')) -split ' ' | ForEach-Object { [long]$_ }
          $all = ($kernel - $before[1]) + ($user - $before[2])
          $busy = $all - ($idle - $before[0])
          "processors: $env:NUMBER_OF_PROCESSORS; busy between the two readings: $([math]::Round(100 * $busy / $all, 1)) percent"

      - name: Capture the native host acceptance record
        env:
          UPSTROKE_TEST_TEMP_FOLDS_CASE: "1"
        run: |
          cargo test --all-features --lib engine::tests::host_acceptance_record -- --ignored --exact --nocapture | Tee-Object -Variable capture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($capture -ccontains 'test engine::tests::host_acceptance_record ... ok') -or -not ($capture -cmatch '^test result: ok\. 1 passed; 0 failed; 0 ignored; ')) { throw "the capture did not run exactly the one host acceptance test to a pass" }
          $f = @($capture | Where-Object { $_ -cmatch '^UPSTROKE-HOST-ACCEPTANCE-RECORD ' } | ForEach-Object { ,($_ -split ' ') })
          $ok = $f.Count -ge 3 -and $f[0].Count -eq 7 -and $f[-1].Count -eq 7 -and $f[0][1] -ceq 'v1' -and $f[0][2] -ceq 'BEGIN' -and $f[-1][1] -ceq 'v1' -and $f[-1][2] -ceq 'END' -and ($f[0][3..6] -join ' ') -ceq ($f[-1][3..6] -join ' ') -and $f[0][4] -ceq "$($f.Count - 2)"
          for ($k = 1; $ok -and $k -lt $f.Count - 1; $k++) { $ok = $f[$k].Count -eq 5 -and $f[$k][1] -ceq 'v1' -and $f[$k][2] -ceq $f[0][3] -and $f[$k][3] -ceq "$k" -and $f[$k][4].Length -eq $(if ($k -lt $f.Count - 2) { 192 } else { 2 * ([long]$f[0][5] - ([long]$f[0][4] - 1) * 96) }) }
          if (-not $ok) { throw "the host acceptance record is missing or its framing is incomplete" }

      - name: Capture the container capability observation
        timeout-minutes: 4
        env:
          UPSTROKE_TEST_TEMP_FOLDS_CASE: "1"
        run: |
          cargo test --all-features --lib runner::container::tests::container_capability_record -- --ignored --exact --nocapture | Tee-Object -Variable capture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($capture -ccontains 'test runner::container::tests::container_capability_record ... ok') -or -not ($capture -cmatch '^test result: ok\. 1 passed; 0 failed; 0 ignored; ')) { throw "the observation did not run exactly the one container capability test to a pass" }
          $f = @($capture | Where-Object { $_ -cmatch '^UPSTROKE-CONTAINER-CAPABILITY-RECORD ' } | ForEach-Object { ,($_ -split ' ') })
          $ok = $f.Count -ge 3 -and $f[0].Count -eq 7 -and $f[-1].Count -eq 7 -and $f[0][1] -ceq 'v1' -and $f[0][2] -ceq 'BEGIN' -and $f[-1][1] -ceq 'v1' -and $f[-1][2] -ceq 'END' -and ($f[0][3..6] -join ' ') -ceq ($f[-1][3..6] -join ' ') -and $f[0][4] -ceq "$($f.Count - 2)"
          for ($k = 1; $ok -and $k -lt $f.Count - 1; $k++) { $ok = $f[$k].Count -eq 5 -and $f[$k][1] -ceq 'v1' -and $f[$k][2] -ceq $f[0][3] -and $f[$k][3] -ceq "$k" -and $f[$k][4].Length -eq $(if ($k -lt $f.Count - 2) { 192 } else { 2 * ([long]$f[0][5] - ([long]$f[0][4] - 1) * 96) }) }
          if (-not $ok) { throw "the container capability record is missing or its framing is incomplete" }

  shard:
    name: shard (${{ matrix.name }})
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 1-of-4
            args: "engine::topology::coordinator::tests::a"
          - name: 2-of-4
            args: "engine::topology:: --skip engine::topology::coordinator::tests::a"
          - name: 3-of-4
            args: "engine:: --skip engine::topology::"
          - name: 4-of-4
            args: "--skip engine::"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install the image's toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: clippy

      - name: Configure git identity
        run: |
          git config --global user.email "ci@upstroke.local"
          git config --global user.name "upstroke CI"

      - name: Describe the machine
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          "processors: $env:NUMBER_OF_PROCESSORS"
          Get-CimInstance Win32_Processor | Format-List Name, NumberOfCores, NumberOfLogicalProcessors, MaxClockSpeed
          Get-CimInstance Win32_ComputerSystem | Format-List Model, TotalPhysicalMemory
          Get-Volume | Format-Table DriveLetter, FileSystemType, DriveType, Size, SizeRemaining
          Get-PhysicalDisk | Format-Table FriendlyName, MediaType, BusType, Size
          "TEMP: $env:TEMP"
          "RUNNER_TEMP: $env:RUNNER_TEMP"
          "GITHUB_WORKSPACE: $env:GITHUB_WORKSPACE"
          Get-MpComputerStatus | Format-List AMServiceEnabled, AntivirusEnabled, RealTimeProtectionEnabled, OnAccessProtectionEnabled, BehaviorMonitorEnabled, IoavProtectionEnabled, IsTamperProtected
          Get-MpPreference | Format-List DisableRealtimeMonitoring, ExclusionPath, ExclusionProcess
          git --version
          exit 0

      - name: Read the processor times before the suite
        continue-on-error: true
        run: |
          $times = Add-Type -PassThru -Namespace Measure -Name Times -MemberDefinition '[DllImport("kernel32.dll")] public static extern bool GetSystemTimes(out long idle, out long kernel, out long user);'
          $idle = 0L; $kernel = 0L; $user = 0L
          $null = $times::GetSystemTimes([ref]$idle, [ref]$kernel, [ref]$user)
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'processor-times-before.txt') -Value "$idle $kernel $user"

      - name: Test one shard
        env:
          UPSTROKE_TEST_TEMP_FOLDS_CASE: "1"
        run: |
          $rustc = ((cargo rustc -q --lib -- --version) | Out-String).Trim(); $path_rustc = ((rustc --version) | Out-String).Trim(); $cargo = ((cargo --version) | Out-String).Trim()
          if ($rustc -notmatch '^rustc 1\.97\.1 ' -or $path_rustc -notmatch '^rustc 1\.97\.1 ' -or $cargo -notmatch '^cargo 1\.97\.1 ') { throw "the suite would run on '$rustc' (Cargo's compiler), '$path_rustc' (PATH's rustc) and '$cargo', not the image's 1.97.1: a compiler was chosen by something other than this workflow" }
          cargo test --all-targets --all-features -- ${{ matrix.args }} | Tee-Object -Variable log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $passed = [int](($log | Select-String -Pattern '^test result: ok\. (\d+) passed' | ForEach-Object { [int]$_.Matches[0].Groups[1].Value } | Measure-Object -Sum).Sum)
          "this shard reported $passed passing tests"

      - name: Read the processor times after the suite
        if: always()
        continue-on-error: true
        run: |
          $times = Add-Type -PassThru -Namespace Measure -Name Times -MemberDefinition '[DllImport("kernel32.dll")] public static extern bool GetSystemTimes(out long idle, out long kernel, out long user);'
          $idle = 0L; $kernel = 0L; $user = 0L
          $null = $times::GetSystemTimes([ref]$idle, [ref]$kernel, [ref]$user)
          $before = (Get-Content (Join-Path $env:RUNNER_TEMP 'processor-times-before.txt')) -split ' ' | ForEach-Object { [long]$_ }
          $all = ($kernel - $before[1]) + ($user - $before[2])
          $busy = $all - ($idle - $before[0])
          "processors: $env:NUMBER_OF_PROCESSORS; busy between the two readings: $([math]::Round(100 * $busy / $all, 1)) percent"
