# The wrapper classification.
#
# `decisions.effect_site_inventory.mechanism` (3): "at PR5 every pubfn of a legacy
# or shared module is classified effectful or effect-free by review; effectful
# wrappers are added to the disallowed list themselves, so a topology module
# cannot reach an effect through a legacy wrapper while legacy modules keep
# calling them under their module allow".
#
# FOUR CLASSES, not two, because "effectful" alone loses the distinction the same
# sentence draws two clauses later ("EventLog::open and EventLog::append are
# classified as the Event funnel (site-taking) rather than as wrappers"):
#
#   funnel                -- issues its effect inside a site-taking funnel call.
#                            NOT denied: it is the sanctioned path.
#   effectful             -- reaches an effect, takes no site, and is nameable as
#                            a path. DENIED in clippy.toml; the test
#                            `every_effectful_wrapper_is_on_the_disallowed_list`
#                            asserts both directions.
#   effectful_unnameable  -- reaches an effect and no topology module can call
#                            it by a path clippy.toml could deny: a trait impl's
#                            method (the path clippy resolves at a call is the
#                            trait's, whose denial would refuse every caller of
#                            the trait), a `Drop` body, an item of a private
#                            module none of whose parent's descendants is a
#                            topology module, or the binary crate root.
#                            Recorded so the absence from clippy.toml is a
#                            decision. A private `mod` of `engine` is NOT this:
#                            `engine::topology::*` descends from `engine`, so a
#                            `pub(super)` item there is reachable, and clippy
#                            resolves a path through a private module (#306
#                            measured both, from `engine::topology::integrate`).
#   effect_free           -- reaches no effect of its own.
#
# THE BOUNDARY, STATED. This classifies reach at the MODULE'S OWN BOUNDARY: a fn
# whose own body performs or hands out an effect. It is not the transitive
# closure over the crate, because the transitive closure of "reaches an effect"
# in a program whose purpose is to perform effects is the whole program -- it
# would deny every CLI entry point and everything between it and a wrapper.
# (`engine::run_harness` was this sentence's example until 2026-09-20. It IS
# denied since then, and not by that closure: it moved into
# `src/engine/coordinator.rs`, where it reaches the conductor without leaving
# its file, which is the walk this record applies.) The
# residue that leaves is exactly one thing: a topology module reaching an effect
# through a chain of undenied public functions, and that is closed from the other
# end by `effects::tests::no_topology_module_calls_a_funnel_in_production`.
#
# A NAME IS NOT A CALLABLE, SO A SHARED NAME IS PINNED. Rows are bare names (or
# `Type::name`, compared by its last component), and a denial names one path. A
# second callable under a classified name was therefore answered for by a row
# nobody wrote for it: the review of 409a6138 put a `pub(crate) fn run` calling
# `std::fs::write` in an inline module of `src/engine/coordinator.rs`, beside the
# effectful entry point `run`, and the census and clippy stayed green
# (`PR309-INLINE-WRAPPER-NAME-COLLISION`). `shared = { name = n }` says that `n`
# callables of the file's production code bear `name`, for every name more than
# one bears; `effects::tests::every_name_more_than_one_callable_bears_is_pinned_by_its_count`
# derives the counts and asserts the table exactly, both ways. A module with no
# `shared` table has no shared name. Raising a count says that every bearer is
# what the row says. AN EFFECTFUL NAME IS SHARED ONLY BY BEARERS OF ONE PATH --
# `cfg` twins, or a trait's declaration and its impls -- because no record can
# be written for a second path: a denial for it needs a row, and a row for it
# is a name in two classes. The review of 1ff88a78 pinned `run_with = 2` over a
# second, undenied `run_with` and everything stayed green
# (`PR309-SHARED-EFFECTFUL-PIN-CANNOT-RECORD-ITS-DENIAL`);
# `effects::tests::an_effectful_name_is_shared_only_by_bearers_of_one_path`
# refuses that pin. ALL OF THIS READS THE NAMES THE SOURCE WRITES: a function a
# macro names by substitution, or one an aliased `include!` brings in, is in no
# count and no class (`PR7-WRAPPERS-EMPTY-DOMAIN`, deferred, with the project
# owner).
#
# Regenerate the membership (never the classification) with
# UPSTROKE_REGENERATE_EFFECT_ARTIFACTS=1 cargo test -p upstroke effects::

[[module]]
path = "src/workspace_manager.rs"
crate_path = "upstroke::workspace_manager"
shared = { common_git_dir = 2, object_exists = 2 }
funnel = [
