# The three production children the `m5-host` split gave `src/runner/host.rs`,
# added in the same commit as the split. Ten externally reachable `fn`s left
# the parent's file, and a name that leaves the domain is a name nobody has to
# classify any more -- so the children join `CLASSIFIED_MODULES` by name, one
# path each, which is the only form that list has: its census joins every entry
# onto the manifest root and reads it as a source file, so there is no prefix to
# widen `src/runner/host.rs` into. `C-002` is the standing finding that the
# roll-call is hand-maintained, and it is not this split's.
#
# THE REPOINT IS A NET WIDENING OF SIX, written down rather than implied: 10
# names leave the parent's block and 16 arrive in the children's.
#
#   * `lookup` (`HostEnvironment::lookup`), `is_bare_name` and `is_program`
#     (`ProgramNaming`'s), `composed_value` and `resolve_program` were PRIVATE
#     `fn`s of `src/runner/host.rs`, below the classification threshold
#     entirely. The extraction makes them `pub(super)` in their children so the
#     parent and `runner::host::tests` can still reach them by name, and a
#     `pub(super) fn` is externally reachable, so they must be classified now.
#     `pub(super)` here is `runner::host` and its descendants and nothing wider.
#   * `current` named TWO items inside the parent's file -- `KeyCase::current`
#     (`pub`) and `ProgramNaming::current` (private) -- and this record
#     classifies by bare name, so one entry covered the reachable one. The split
#     separates the pair into different files, and the private half becomes
#     `pub(super)`, so each is now classified on its own.
#
# Every one is a widening. No name that was classified before is unclassified
# now.
#
# All three children are `effect_free`, and that is what the split was arranged
# to make true: no funnel, no effect site and no `cfg` moved. `HostRunner::run`
# with its two `ProcessSite` values, `build_command_at` with the crate's one
# host-side `std::process::Command`, the `Contained` mint and the reserved-key
# vocabulary all stayed in the parent, which keeps the allowlist identity. Each
# child DENIES all three governed lints at file scope and takes no
# `effects/allowlist.toml` row.
#
# `crate_path` names each child by its real path, as every library module's
# does since #306 (`only_the_binary_crate_root_leaves_its_crate_path_empty`).
# An earlier revision left all three EMPTY "because each is a private `mod`",
# reading the `ModuleClassification` contract as "empty when the module is not
# reachable from outside its parent" with `src/engine/{coordinator,resume,
# attempt,preflight}.rs` as the convention; the revision before that had
# recorded `upstroke::runner::host::probe` and was told `E0603` made the path
# unnameable (review finding 2 on PR #111). `E0603` is a use site's privacy
# error, not clippy's: `disallowed-methods` resolves a path through a private
# module (#306 measured it on `engine::attempt`), and the modules that
# convention pointed at were exactly where an effectful `pub(super)` fn had
# gone undenied. If one of these `fn`s is ever reclassified effectful, the
# stored path can name it for the denylist, which is what the field is for.
