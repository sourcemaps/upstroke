# The legacy conductor's three modules, added to the domain by the
# `PR7-WRAPPERS-EMPTY-DOMAIN` repair. Until it, `externally_reachable_fns` read
# the truncating region; each of these files has a `#[cfg(test)] use` among its
# imports, so each derived domain was empty and the all-empty record that stood
# here compared equal to it -- forty-seven names across six files, classified
# by a census that read none of them. Each carries its real crate path: a
# `pub(super)` item of a private `mod` of `engine` is visible to every module
# under `engine::topology`, and clippy resolves the path (#306: a reference to
# `crate::engine::attempt::run_attempt` from `engine::topology::integrate`
# passed clippy undenied, and failed it once the path was listed), so an
# effectful name here is `effectful` and denied, never `effectful_unnameable`.
#
# THE RULE THESE ROWS APPLY, stated once so a reviewer checks every row against
# it rather than against the classifier's mood. A body is classified by what it
# reaches WITHOUT LEAVING ITS FILE: its own statements and, transitively, every
# fn, method and `Drop` body the same file declares, private or not. The walk
# stops at the file's boundary, where the record answers for it: a call into
# another classified module is what that module's row says it is, and a call
# into a module `CLASSIFIED_MODULES` does not list is outside the domain by the
# design's own choice of what to classify (the residue the header names). So a
# name is
#   effectful (or effectful_unnameable, by the class above) when the walk
#     reaches an effect primitive -- a std, libc or windows_sys path
#     clippy.toml denies, used in a mode that mutates -- or a name this file
#     classifies effectful or effectful_unnameable, in its own module or
#     another. The precedents are `review::run_review`, effectful for writing
#     through `util::write_text`, and `util::fsync_file_at`, effectful for
#     delegating to `fsync_file`;
#   funnel when it takes an effect site by value (`Supervisor::begin`) or acts
#     on the site a funnel row handed it and re-checks that site before acting
#     (`Supervisor::finish`);
#   effect_free when everything the walk reaches is a site-taking funnel (the
#     sanctioned path; `runner::host::HostRunner::run` is the precedent), a
#     trait object the body was handed (`&dyn Runner`, `&dyn AgentAdapter`,
#     `&mut dyn SpawnHooks`: the effect is the callee's, as
#     `engine::preflight::preflight` records), an effect-free row, or a read.
#     A read is not an effect on this denylist, which governs creation,
#     writing, removal, rename and process start -- and that includes a denied
#     primitive asked in a mode that mutates nothing, which is what
#     `observe_child_group` (`waitid` with `WNOWAIT`) already records.
# A `_with` seam whose production instantiation is the entry point beside it is
# classified as that entry point (`join_ambient_job_with` is the precedent).
# The rule is NOT immediate-call-only. The first version of these rows exempted
# "a private helper of its own module", which made `CodexAdapter::probe`
