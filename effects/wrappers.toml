# `setsid` and the `exec*` family are in this list and appear nowhere in the
# tree: `mechanism` (1) names them regardless ("libc fork/kill/setpgid/setsid/
# flock/fcntl/exec*"), and a denial of a primitive the crate does not yet call is
# the cheapest kind there is. `every_platform_conditional_denial_names_something_
# real` carries them in its PACKET_ONLY set for the same reason.
